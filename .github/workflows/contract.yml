name: Contract

# The tier that talks to the real third parties - Claude, the Workers AI model
# that reads what a note means, and the Bot Framework's published signing keys
# (docs/testing-strategy.md, "Third parties"):
# everything below it runs against a fake, and this is what says the fake still
# resembles the thing. Scheduled rather than per pull request,
# because every run spends real money and the model is not deterministic - a
# tier that ran on every push would be a bill and a flake in front of every
# merge.
#
# Nightly, and by hand from the Actions tab when the prompt changes - which is
# the run that matters, a prompt being the only half of this contract we own.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The connector's own contract suite: what Microsoft publishes for
      # checking a saved Teams message, asked of Microsoft ("Save a Teams
      # message to Cockpit", issue 486). No secret - the Bot Framework's
      # signing keys are published to anyone - and first, because a failure
      # here costs nothing and a failure below costs the model's time.
      - run: pnpm --filter @cockpit/connector-teams test:contract
      # A missing secret presents as a workflow that goes green having done
      # nothing, which is the failure docs/deployment.md records for
      # `CLAUDE_CODE_OAUTH_TOKEN`. Each suite itself refuses to run without its
      # own credential (tests/contract/), so this only names the secrets; it
      # does not print them. The Cloudflare pair is the same pair the deploy
      # workflows already use, and is what reads what a note means - which needs
      # Workers AI: Read on that token beside the scopes a deploy needs
      # (docs/deployment.md, "Bootstrap runbook").
      - run: pnpm --filter @cockpit/api test:contract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
