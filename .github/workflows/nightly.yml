name: Nightly

# The reports that are too dear to build on every merge, built once a night
# ("Run the lead-time report nightly, and publish it beside the other two",
# issue 515). The cycle-time report re-reads 14 days of history, which
# takes most of the 1,000 requests an hour every workflow in this repository
# shares (tools/cycle-time/src/github.js works it out):
# run on each merge it would fail in a burst, and take the stability report
# down with it.
#
# **Each report is its own job**, so adding one is adding a job and one failing
# costs no other. `publish.yml`, shared with `ci.yml`'s own call to it, takes
# each report's newest artifact from a run on `main`, not the newest successful
# run, for the same reason: a run where another job failed still has this
# one's page. Calling it here too, rather than only from `ci.yml`, means a
# scheduled run goes live the same night instead of waiting on the next
# unrelated merge, and a manual run is "publish this now" while working on a
# report ("Publish nightly's reports the same night, and make a manual run go
# live too", issue 563).
#
# Not `contract.yml`, which spends money and holds its own secrets, and not
# `ci.yml`, which would run the whole suite.
#
# Nightly, and by hand from the Actions tab when a night was missed. Off the
# hour, because GitHub delays scheduled runs at the top of an hour.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cycle-time:
    name: Cycle time
    runs-on: ubuntu-latest
    # Reads pull requests, their commits, their check runs and the Actions API,
    # all through the workflow's own token. Nothing else, and no write to GitHub:
    # the one write is to the Harness Monitor, below.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Node only, no install: the report reads the API with the standard
      # library, as the stability job does, and the runner's own Node is not
      # promised to be the one the repository asks for.
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # Also sends the merged pull requests to the Harness Monitor, from the
      # newest merge it holds less two days, after the page is written. The
      # write key is handed over on `main` only, never to a branch a manual run
      # could pick. Until both the secret and the variable are set it says so
      # and only writes the page (docs/deployment.md, "The Harness Monitor").
      - name: Work out where a change spends its time
        run: |
          send=--send
          if [ -z "$HARNESS_WRITE_KEY" ] || [ -z "$HARNESS_MONITOR_URL" ]; then
            echo "::notice title=Cycle time not sent::The secret HARNESS_WRITE_KEY or the variable HARNESS_MONITOR_URL is not set, or this run is not on main, so the pull requests did not reach the Harness Monitor. See docs/deployment.md, \"The Harness Monitor\"."
            send=
          fi
          node tools/cycle-time/src/cli.js --out tools/cycle-time/out/index.html --model tools/cycle-time/out/model.json $send
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_WRITE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.HARNESS_WRITE_KEY || '' }}
          HARNESS_MONITOR_URL: ${{ vars.HARNESS_MONITOR_URL }}
      # A send the Monitor refused, or the pull budget cut short, fails the step
      # above with the page already written, so the page is still uploaded.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cycle-time-report
          path: tools/cycle-time/out/

  # Whether test selection is working: misses, what forces a full run, and
  # which tests are selected most often, read across pull requests ("Publish a
  # test selection report", issue 540). Nightly for the same reason as
  # cycle-time above: up to ten requests per pull request read, which a run on
  # every merge would burn through this workflow's shared hourly allowance.
  selection:
    name: Selection
    runs-on: ubuntu-latest
    # Reads pull requests, their files, the Actions API and each Test run's own
    # artifact, all through the workflow's own token, and files, edits and
    # comments on the `selection-alarm` issues: the one write, on this job
    # alone ("File and update a selection alarm issue from the nightly job",
    # issue 1290).
    permissions:
      contents: read
      pull-requests: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      # Also sends each pull request's selection to the Harness Monitor, from the
      # newest merge it holds less two days, after the page is written. The write
      # key is handed over on `main` only, never to a branch a manual run could
      # pick. Until both the secret and the variable are set it says so and only
      # writes the page (docs/deployment.md, "The Harness Monitor").
      - name: Work out whether test selection is working
        run: |
          send=--send
          if [ -z "$HARNESS_WRITE_KEY" ] || [ -z "$HARNESS_MONITOR_URL" ]; then
            echo "::notice title=Selection not sent::The secret HARNESS_WRITE_KEY or the variable HARNESS_MONITOR_URL is not set, or this run is not on main, so the pull requests did not reach the Harness Monitor. See docs/deployment.md, \"The Harness Monitor\"."
            send=
          fi
          node tools/selection/src/cli.js --out tools/selection/out/index.html --model tools/selection/out/model.json $send
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_WRITE_KEY: ${{ github.ref == 'refs/heads/main' && secrets.HARNESS_WRITE_KEY || '' }}
          HARNESS_MONITOR_URL: ${{ vars.HARNESS_MONITOR_URL }}
      # A send the Monitor refused, or the pull budget cut short, fails the step
      # above with the page already written, so the page is still uploaded.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-selection-report
          path: tools/selection/out/
      # After the upload, so a refused write turns this job red and costs the
      # page nothing: Publish already tolerates a failed report job. Runs after a
      # failed send too, whenever the model was written, since the alarms read
      # that and not the Monitor.
      - name: File, update or comment on the alarm for each bar
        if: ${{ !cancelled() && hashFiles('tools/selection/out/model.json') != '' }}
        run: node tools/selection/src/alarm-cli.js --model tools/selection/out/model.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # How Cockpit is deployed, drawn from the checkout alone: every environment
  # the Worker config declares with the resources it binds, and every workflow
  # ("Draw Cockpit's deployment every night, beside the other reports", issue
  # 871). Reads no API, so unlike the reports above it needs no token and no
  # permission beyond the checkout. It does install its own package, which
  # parses YAML and JSONC rather than carrying a parser of each; the filter
  # keeps that to those few packages, not the whole workspace. What changed
  # ("Show what changed in Cockpit's architecture since the last report", issue
  # 874) draws the commit the live report names, so the checkout holds the whole
  # history, and the live model is the one thing fetched; a model that cannot be
  # fetched costs that section, never the night.
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cockpit/architecture
      - name: Draw how Cockpit is built and what changed since the live report
        run: >-
          node tools/architecture/src/cli.js
          --out tools/architecture/out/index.html
          --model tools/architecture/out/model.json
          --previous "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/architecture/model.json"
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-report
          path: tools/architecture/out/

  # Puts tonight's reports live, alongside whatever the last merge to `main`
  # published — `!cancelled()` so one report's failed build still lets the
  # other's page out, the same tolerance `needs` already gives the jobs above.
  # A manual dispatch reaches this job too, since it is not gated on the
  # schedule that started the run, only on being on `main`.
  publish:
    name: Publish
    needs: [cycle-time, selection, architecture]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/publish.yml
