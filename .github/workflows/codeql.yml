name: CodeQL

# Analyses main on every merge and on a weekly schedule - never on a pull
# request. "Decide whether CodeQL earns its run on every pull request push, or
# moves to main and a schedule" (issue 379) measured 40 sampled runs on 10 to
# 12 September 2026: every leg concluded success and no CodeQL alert had ever
# held a pull request, against roughly 4 of a push's 39 billed minutes paid to
# the two legs every time. An alert now surfaces within a week of merging
# rather than before a pull request can merge - the cost that bought.
#
# Removing the pull-request trigger meant removing CodeQL's three contexts from
# required_status_checks first: a required context nothing reports under sits
# at *Expected* forever once nothing triggers it, which is the ordering note in
# deployment.md's "Bootstrap runbook" applied in the direction this issue
# needed rather than the direction that note was written for.
#
# Deliberately no path filters, on this workflow or on claude-code-review.yml.
# A required status check whose *workflow* never triggers does not report green -
# it does not report at all, and a pull request that required one would wait on
# it forever. Moot for the push and schedule triggers here, which nothing
# gates, but the principle is why the trigger was removed rather than gated.
on:
  push:
    branches: [main]
  schedule:
    # Weekly rather than more often: main's alerts are a backstop now that
    # nothing analyses a pull request before it merges, and the cost this issue
    # measured only argued for less frequent runs, not zero.
    - cron: '0 3 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  # Never cancel a run on main: its analysis is the baseline every future
  # comparison reads against, so cancelling one leaves that baseline standing
  # at an older commit. There is no pull request run left to cancel superseded
  # copies of.
  cancel-in-progress: false

jobs:
  analyze:
    # This name is what the Security tab groups alerts under, once per matrix
    # leg: "CodeQL (javascript-typescript)" and "CodeQL (actions)". Neither is a
    # required status check any more - issue 379 removed all three CodeQL
    # contexts from required_status_checks when it took CodeQL off the
    # pull-request gate - so renaming either the job or the matrix values loses
    # continuity in the Security tab rather than blocking a merge.
    #
    # These two say the analysis ran. They do not say it was clean: the check
    # that fails on a high-severity alert is a third one, named "CodeQL" and
    # posted by GitHub Advanced Security rather than by this workflow.
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writing the analysis results back is the entire point of the job.
      security-events: write
      # Declaring any permissions block sets every scope not listed to `none`,
      # so this line is not the no-op it looks like. GitHub's own CodeQL
      # template carries it, documented as needed for workflows in private
      # repositories - which this one is not, and the cost of finding that out
      # the hard way is two failing legs whose error names neither this block
      # nor the visibility change that caused it.
      actions: read

    strategy:
      # One leg's failure must not cancel the other's: an infrastructure failure
      # analysing the workflows says nothing about the sources, and burying the
      # sources' result would make a partial run look like a whole one.
      fail-fast: false
      matrix:
        include:
          # The application itself. build-mode "none" is right for an
          # interpreted language: CodeQL reads the sources directly, so there is
          # no build to drive and no toolchain to install - which is also why
          # this job does not use .github/actions/setup.
          - language: javascript-typescript
            build-mode: none
          # The workflows themselves, which is where this repository's own risk
          # is concentrated: they run Claude against an OAuth token and they
          # check out pull request branches. The queries here are the ones that
          # find an untrusted value interpolated into a run block, and a
          # permission granted wider than the job needs.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # No assertion step, unlike claude-code-review.yml. That gate exists
      # because a Claude session can decline to review and still exit zero; this
      # action fails the job when the analysis fails, so a broken run is already
      # red rather than a green tick over nothing.
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
