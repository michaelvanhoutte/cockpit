name: CI

# Every push, on every branch. This used to be scoped to the trunk, because
# deploy-preview.yml ran the same checks on branch pushes on its way to building
# a preview; that workflow is gone (docs/deployment.md, "No branch
# environments"), and without this a branch with no open pull request would be
# gated by nothing at all.
#
# **A branch with an open pull request is therefore checked twice**, once per
# event, which the old comment here called out as the thing to avoid. That
# reasoning is reversed rather than forgotten: the duplicate was avoidable while
# something else gated branch pushes, and the choice now is between running twice
# and not running at all. Both runs earn their place anyway - `push` tests the
# branch tip, which is what a branch with no pull request has, and
# `pull_request` tests the merge result, which is what actually lands. Branch
# protection does not require a branch to be up to date (`strict: false`), so
# those are genuinely different trees.
#
# The push trigger overlaps slightly with deploy-staging.yml, which gates itself
# before deploying. That is deliberate: the merge commit on main is a tree that
# has never been tested as such, and these four split jobs attribute a failure
# faster than the same checks inlined into a deploy job.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Architecture §9.1 asks for the fast test tiers split one job per tier, so a
  # misplaced test is visible. Today Cockpit is one service with one test file,
  # and testing-strategy §2 is explicit that levels are roles rather than
  # mandatory folders ("do not invent tests or empty folders just to populate
  # the taxonomy"). So: real jobs only, split along the lines that exist now.
  # The per-tier split lands with the tiers.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  # F3, the browser tier. Its own job rather than part of `Test`, because it is
  # the one tier that boots the whole application (wrangler + local D1 + Vite)
  # and downloads a browser: folded into `Test` it would put minutes and a
  # browser install in front of every unit-test failure, and the CI/CD section
  # of the architecture (§9.1) wants a misplaced test visible as a job in any
  # case.
  #
  # This runs against the tier's own local stack (scripts/e2e-stack.mjs), which
  # is not quite the deployed shape — no service worker, unbundled modules,
  # Vite's SPA fallback rather than the Worker's asset routing. Those three break everything at once
  # rather than one feature at a time, and the intended cover for them is the
  # same suite pointed at the branch preview (E2E_BASE_URL plus an Access
  # service token, per playwright.config.ts). That run lands when the token
  # does; see the deferred F3-against-a-preview item in "Deferred, with
  # reasons" (docs/deployment.md §8).
  e2e:
    name: E2E (F3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only Chromium: both Playwright projects (desktop and phone) are
      # Chromium, because this is a viewport and input matrix, not a browser
      # matrix. --with-deps because the runner lacks the shared libraries a
      # browser needs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Traces and screenshots are kept on failure only (playwright.config.ts),
      # so this uploads nothing of Playwright's on a green run.
      #
      # Wrangler's own log goes with them, and it is the half that matters when
      # the *stack* is what failed rather than a test. `wrangler dev` exited 1
      # mid-run on `main` at bc840bb, printing an empty error and taking Vite
      # down with it, so twenty-six tests failed with a connection refused and
      # every screenshot kept was of the same blank page. Wrangler had written
      # the reason to disk — outside the repository, on a runner that was then
      # deleted. `scripts/e2e-stack.mjs` now points it here instead.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            apps/api/.wrangler/logs-e2e/
          # A failure produces one of these or the other, rarely both: a test
          # that failed against a healthy stack leaves screenshots and a log
          # nobody needs, and a stack that died leaves a log and screenshots of
          # the same blank page. Missing is therefore normal, and the default
          # `warn` would put a warning on a job that is already red for a
          # reason it is not about to explain.
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # scripts/ is Node, and carries the logic that decides whether
      # a test run gets a fresh database, whether it is allowed to start at all,
      # and whether a Claude security review actually reached a verdict — worth
      # asserting rather than trusting. The last of those is the one with teeth: it is what turns a blocked or
      # declining review red, and the equivalent logic living as inline bash in
      # claude-code-review.yml has shipped green over a non-review four times.
      # No install step: these tests use only node:test and the standard
      # library, so this job stays checkout-only and finishes in seconds.
      - name: Verify the dev, test-stack, health-check and review-gate scripts
        run: node --test scripts/lib/*.test.mjs

  # Publishes which product concepts own which tests, as a downloadable
  # artifact on every run. Does not gate: docs/test-explorer-spec.md §8
  # deliberately stops short of failing the build on the report's content,
  # only on concepts.json drift (a source file the registry can't place).
  test-explorer:
    name: Test Explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:explorer:check
      # Runs the suite a second time, instrumented (apps/api uses the
      # istanbul provider, not v8 — the Workers runtime has no
      # node:inspector Session API for v8 to attach to; see
      # apps/api/vitest.config.ts), so "branches nothing takes" reports real
      # data instead of "unknown". A second full run rather than reusing the
      # `test` job's is the cost of that: coverage instrumentation is not
      # free, and Actions jobs don't share a filesystem without an explicit
      # artifact hop, which running it again here avoids needing.
      - run: pnpm test:coverage
      - run: pnpm test:explorer
      - uses: actions/upload-artifact@v4
        with:
          name: test-explorer-report
          path: tools/test-explorer/out/
