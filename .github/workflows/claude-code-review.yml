name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # One review per pull request at a time. Superseded runs are cancelled: the
  # verdict that matters is the one for the current head, and paying for a
  # review of a commit nobody will merge buys nothing. Copied from
  # claude-security-review.yml, which had it while this file did not - eight
  # reviews ran to completion on `claude/richtext-action-scope-afec5f` in a day,
  # none under ten minutes, each posting against a different head. (codeql.yml
  # groups too, but cancels only on a pull request: its runs on `main` are the
  # baseline every pull request is compared against.)
  #
  # **This sharpens issue 75**, "The review check goes green when the reviewer
  # declined to look at the new commits". Cancel a run that has already posted
  # some of its findings and the run replacing it can decline as
  # already-reviewed, which the gate below reports as a warning rather than a
  # failure - a half-review, green. Cancelling is still right, because the
  # alternative is paying for every superseded run in full; the exposure belongs
  # to that issue, not to this group.
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # A fork's pull request gets a read-only token and no secrets, so this job
    # cannot run - and left to fail it would report red for a reason that has
    # nothing to do with the change, which is how a check stops being read.
    # Skipping says so instead. Never solved by reaching for
    # `pull_request_target`: that runs the base branch's workflow with the
    # secrets in scope against code the author controls, which on a public
    # repository hands CLAUDE_CODE_OAUTH_TOKEN to anyone who opens a pull
    # request. The same guard, and the same reasoning, is in
    # claude-security-review.yml.
    #
    # A draft is work in progress, and reviewing every intermediate push of one
    # costs a full run each time to tell someone something they already know
    # they have not finished. Marking it ready for review is in the trigger
    # types above, so a draft is reviewed the moment it stops being one. This
    # guard is what makes the skip cheap: the review already declined to *post*
    # on a draft, by an instruction in the prompt below, having first paid for
    # the whole run to reach that conclusion.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review posts inline comments and a summary comment.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review's fourth agent reads git blame/history for context.
          # fetch-depth: 1 leaves it with no history to read.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review commits pushed by the @claude workflow too. An explicit name
          # rather than '*': this repo is public, and '*' would let any GitHub
          # App trigger this workflow with a prompt it controls.
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is what makes the review post. Without it the command
          # stops after printing to a terminal nobody reads.
          prompt: '/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The slash command declares its own allowed-tools, but the subagents
          # it launches do not inherit them, so every gh/git call was denied.
          # Skill is in the list because the plugin command is itself invoked
          # through the Skill tool: run 33201638348 denied "Execute skill:
          # code-review:code-review" and the review never started.
          # The appended system prompt is there because subagents default to
          # running in the background: run 33202122273 launched the review's
          # first agent, said "I will wait for the background agent completion
          # notification rather than polling", and ended. In a one-shot run
          # nothing ever sends that notification.
          # Its second half is there because the command's own stop conditions
          # include one for a pull request that is very simple and obviously ok,
          # and taking that one posts nothing at all: run 33407302266 judged
          # pull request 80 (a single zero-byte file deletion) too trivial to
          # review and stopped after 5 clean turns, having said nothing, which
          # the gate below could not tell from a review that never happened.
          # That decision was defensible - what is not is making it silently.
          # The other silent stop, "already reviewed", at least leaves the
          # earlier round's comments standing; this one leaves the pull request
          # with nothing on it at all. Only this condition is instructed away:
          # declining a genuine re-run stays allowed, and issue 75 ("The review
          # check goes green when the reviewer declined to look at the new
          # commits") owns that one.
          claude_args: >-
            --allowedTools "Skill,Task,Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a single non-interactive run. Nothing will wake you once you stop, so a background task you are waiting on will never report back and the review will end having done nothing. Launch every subagent in the foreground and wait for its result before continuing. Never launch a background task, and never end your turn to wait for a completion notification. One of your stop conditions needs different handling here. Judging a change too simple, too obvious or too automated to be worth reviewing is a legitimate verdict, but it is still a verdict: post a short comment saying that is your conclusion, rather than stopping without a word. Nobody reads this run's log, so a review that ends having posted nothing is indistinguishable from one that never happened, and is treated as a failure. This applies to that condition only. Your other stop conditions are unchanged and must stay silent: say nothing on a closed pull request, say nothing on a draft, and say nothing on one you have already reviewed, where the earlier round's comments still stand."
          # Without this the action hides tool output, so a blocked review is
          # indistinguishable from a clean one.
          show_full_output: true

      - name: Assert the review actually ran
        if: always()
        # bash without -e: this step decides for itself what is fatal.
        shell: bash -uo pipefail {0}
        env:
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          # A real multi-agent review is well above this. The 3-turn and 7-turn
          # runs that used to pass green were both blocked sessions.
          MIN_TURNS: '10'
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FAILED=0
          fail() {
            echo "::error::$1"
            echo "- FAIL: $1" >> "$GITHUB_STEP_SUMMARY"
            FAILED=1
          }

          echo "## Claude review gate" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CONCLUSION" != "success" ]; then
            fail "The review step reported conclusion='$CONCLUSION'."
          fi

          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            fail "The review produced no execution output, so it did not run."
            if [ -z "$CONCLUSION" ]; then
              echo "::notice::The action sets no outputs when it skips itself. The usual cause is its workflow validation: it refuses to run when this workflow file differs from the copy on the default branch, which is the case on any pull request that edits it. That is expected here, but it still means this pull request was not reviewed, so the check is red rather than a green tick that would imply it was."
            fi
            exit 1
          fi

          RESULT=$(jq -c 'if type == "array" then ([.[] | select(.type == "result")] | last) else . end' "$EXECUTION_FILE")
          if [ -z "$RESULT" ] || [ "$RESULT" = "null" ]; then
            fail "The execution output contains no result record."
            exit 1
          fi

          IS_ERROR=$(printf '%s' "$RESULT" | jq -r '.is_error // false')
          SUBTYPE=$(printf '%s' "$RESULT" | jq -r '.subtype // "unknown"')
          TURNS=$(printf '%s' "$RESULT" | jq -r '.num_turns // 0')
          FINAL=$(printf '%s' "$RESULT" | jq -r '.result // ""')

          # The result record does not always carry permission_denials_count -
          # run 33201638348 omitted it entirely while the message stream held a
          # real denial, so the gate read "no denials" off a missing field and
          # went green. Count the stream and trust whichever number is higher.
          DENIED_TOOLS=$(jq -r '[.[]? | select(.type == "system" and .subtype == "permission_denied")] | map(.tool_name // "?") | join(", ")' "$EXECUTION_FILE")
          STREAM_DENIALS=$(jq -r '[.[]? | select(.type == "system" and .subtype == "permission_denied")] | length' "$EXECUTION_FILE")
          SUMMARY_DENIALS=$(printf '%s' "$RESULT" | jq -r '.permission_denials_count // 0')
          DENIALS=$SUMMARY_DENIALS
          [ "$STREAM_DENIALS" -gt "$DENIALS" ] && DENIALS=$STREAM_DENIALS

          {
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| subtype | $SUBTYPE |"
            echo "| is_error | $IS_ERROR |"
            echo "| num_turns | $TURNS |"
            echo "| permission denials | $DENIALS |"
            echo ""
            echo "The session's closing words: $FINAL"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$IS_ERROR" = "true" ]; then
            fail "The review session ended with is_error=true."
          fi

          if [ "$SUBTYPE" != "success" ]; then
            fail "The review session ended with subtype='$SUBTYPE'."
          fi

          # The turn count is the wrong instrument. It is too weak to catch a
          # non-review - run 33201638348 spent 11 turns and stopped with
          # "Waiting on the eligibility check for PR #56 before proceeding" -
          # and strict enough to fail a correct one: run 33203441279 stopped
          # after 5 clean turns because the review had already run on this pull
          # request and the command says to stop when it has. It is a warning
          # below, never a failure.
          #
          # What actually separates a review from a non-review is whether Claude
          # said anything on the pull request. With --comment every path that reaches a verdict
          # posts something - inline comments when there are findings, a summary
          # comment when there are none. Silence otherwise means no verdict was
          # reached, which is the failure this test is for. The command's four
          # stop conditions are the deliberate exceptions, and each is accounted
          # for: closed and draft never reach this test, because PR_STATE
          # excludes them below; "already reviewed" leaves the earlier round's
          # comments standing; and the trivial-change stop is instructed away by
          # the appended system prompt above, which requires that verdict to be
          # posted like any other. Run 33407302266 is why that instruction
          # exists - it took the trivial stop on pull request 80 and failed this
          # gate for a review that had actually reached the right answer.
          VERDICT_SEEN=0
          PR_STATE=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft -q '"\(.state) \(.isDraft)"')
          if [ "$PR_STATE" = "OPEN false" ]; then
            SAID=$( {
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[].user.login'
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" --paginate --jq '.[].user.login'
              gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate --jq '.[].user.login'
            } | grep -ci '^claude' || true )
            if [ "$SAID" -eq 0 ]; then
              fail "The review posted nothing on this pull request. A review that reaches a verdict always says so, so this one did not reach one."
              if [ "$DENIALS" -gt 0 ]; then
                fail "It was blocked by $DENIALS permission denial(s) (${DENIED_TOOLS:-see log}), which is the likely reason."
              fi
            else
              VERDICT_SEEN=1
              echo "- Claude has $SAID comment(s) on this pull request." >> "$GITHUB_STEP_SUMMARY"
              # Every tool the review needs is allowlisted, so a denial here is
              # a tool we deliberately withheld - run 33202686222 was a
              # validation agent reaching for node -e to execute the pull
              # request's own logic, which is not something to grant a review of
              # untrusted code on a public repository. It adapted and posted its
              # findings anyway. Failing that run would train everyone to ignore
              # this check, so a denial is only fatal when no verdict landed.
              if [ "$DENIALS" -gt 0 ]; then
                echo "::warning::The review reached a verdict but $DENIALS tool call(s) were denied (${DENIED_TOOLS:-see log}). Worth a look if its findings seem thin."
                echo "- Note: $DENIALS denied tool call(s): ${DENIED_TOOLS:-see log}." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "- Skipping the posted-comment check: the pull request is $PR_STATE (state isDraft), which the review is entitled to skip." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Marking this check red. A green claude-review must mean the pull request was actually reviewed."
            exit 1
          fi

          if [ "$TURNS" -lt "$MIN_TURNS" ] && [ "$VERDICT_SEEN" -eq 1 ]; then
            echo "::warning::The session ran only $TURNS turns, and Claude has already posted on this pull request - most likely the review declining because it had reviewed this pull request before, in which case the commits pushed since then have not been looked at. Its closing words: $FINAL"
          elif [ "$TURNS" -lt "$MIN_TURNS" ]; then
            echo "::warning::The session ran only $TURNS turns. Its closing words: $FINAL"
          fi

          echo "- OK: $TURNS turns, no unexplained denials, and Claude has posted its verdict on the pull request." >> "$GITHUB_STEP_SUMMARY"
