# Throwaway: builds the Panel widget POC's APK. Deleted with the poc/panel-widget branch.
name: Panel widget POC

on:
  push:
    branches: [poc/panel-widget]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/panel-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # One debug key for every build, so a new APK installs over the last one and keeps its log
      # and battery setting. The first run without it generates one and uploads it to be committed.
      - run: mkdir -p ~/.android && if [ -f debug.keystore ]; then cp debug.keystore ~/.android/debug.keystore; fi
      - run: gradle --no-daemon assembleDebug && cp ~/.android/debug.keystore app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: panel-widget-poc
          path: |
            poc/panel-widget/app/build/outputs/apk/debug/app-debug.apk
            poc/panel-widget/app/build/outputs/apk/debug/debug.keystore
