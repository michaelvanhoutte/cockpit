name: CI

# Push, but only on `main`. `pull_request` tests the merge result, which is
# what actually lands, so it is the only event that checks an open branch —
# scoping push everywhere used to check a branch's tip a second time, and the
# two disagreed on 13 of 155 such commits across the pull requests merged
# 6–9 September ("Validate a commit once, not twice by CI and again for
# every clean merge of main", issue 311).
#
# **A branch with no open pull request is therefore checked by nothing.**
# That gap is why push used to run everywhere: deploy-preview.yml ran the same
# checks on branch pushes on its way to building a preview, and without it an
# unreviewed branch would be gated by nothing at all. That workflow is gone
# (docs/deployment.md, "No branch environments"); the gap it leaves is
# accepted rather than closed, because /issue's own process already runs
# typecheck, lint, the tests and a browser pass by hand throughout a unit of
# work, and opens the pull request only once that is already done.
#
# The push-to-main trigger overlaps slightly with deploy-staging.yml, which
# gates itself before deploying. That is deliberate: the merge commit on main
# is a tree that has never been tested as such, and these four split jobs
# attribute a failure faster than the same checks inlined into a deploy job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, because declaring any permissions block sets every scope
# not listed to `none` (the same mechanism codeql.yml documents). Without this
# every job here runs on whatever the repository's default token grants, which
# is `pages: write` and `contents: write` where the default is read-and-write —
# held by jobs that run arbitrary package code. `pages` below re-grants itself
# what it needs, and nothing else in this file gets it.
permissions:
  contents: read

jobs:
  # Whether this diff touches anything the five mechanical jobs below cover.
  # Each of them skips when it does not, and a skipped job satisfies a required
  # status check (docs/deployment.md, "Bootstrap runbook"), so every context
  # still reports — which a workflow-level `paths:` filter would not, and is why
  # codeql.yml's own comment rules that out ("Skip the mechanical checks on a
  # pull request that touches nothing they cover", issue 345). CodeQL is not
  # gated on this at all; codeql.yml says why.
  #
  # The decision is scripts/lib/what-changed.mjs, asserted by node --test in the
  # `Scripts` job: `docs/`, `.claude/` and root-level `*.md` are the only paths
  # that skip, and anything else runs everything.
  #
  # `Concepts` and `Stability` carry no gate of their own either, and issue
  # 345 left them that way rather than deciding it: whether the reporting
  # pipeline should skip too was out of scope there. One consequence follows
  # from `Test Explorer` needing `Test` regardless: on a documentation-only
  # push to `main`, `Test Explorer` (and `Publish` behind it) skips for free,
  # while `Stability` — ungated, unrelated to `Test` — still runs and spends
  # part of its rate-limited Actions-API budget on a report `Publish` will not
  # deploy. Narrow and self-correcting on the next code merge, not fixed here.
  #
  # This closes one gap in what a pull request's own head can influence — the
  # classifier's decision — and not the wider one: `pull_request` still builds
  # this very workflow file from the merge ref, so a branch with write access
  # could edit `changes` itself, or drop `needs: changes` from a job below, and
  # get the same five skips this guards against. Pinning the classifier closes
  # the quiet route; it was never going to close the loud one, which every
  # workflow file in this repository already trusts required checks over.
  #
  # Checkout-only and no install, for the reason `scripts` gives, so it costs
  # the jobs that wait on it seconds rather than a minute. `fetch-depth: 0`
  # because the range it diffs reaches back to the base commit, and the whole
  # history is 8MB packed.
  #
  # **Both steps are `continue-on-error`**, so any failure inside either one
  # leaves `product_changed` unwritten and the gate's `!= 'false'` runs
  # everything - the dangerous direction is a skip nobody meant, since `needs`
  # on a failed job skips the lot and a skip is what a required check accepts.
  #
  # That does not make the *job* unable to fail: "Set up job", the platform
  # phase ahead of either step, answers to neither `continue-on-error`, and a
  # runner that never starts reports this job `failure` with nothing of ours
  # having run. The five gates below therefore read `!failure()`, not a bare
  # `if:` - GitHub's default `success()` would skip all five exactly there,
  # which is the same hole with the run undamaged rather than tampered with.
  # `!failure()`, unlike `!cancelled()`, does not also opt this job out of the
  # ordinary cancellation cascade: a genuinely cancelled run still leaves a
  # required context reading `cancelled` (docs/deployment.md, "Bootstrap
  # runbook"), which is what matters, and `!failure()` is silent on that case
  # rather than fighting it - a downstream job it lets through gets cancelled
  # in turn once it starts, the same as it always would have.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      product_changed: ${{ steps.classify.outputs.product_changed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the product
        id: classify
        continue-on-error: true
        env:
          # Into the environment rather than into the script text, which is the
          # shape CodeQL's `actions` leg asks for.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # **The classifier runs from the base commit, never from this branch.**
          # `pull_request` builds the merge ref, so the copy in the tree is the
          # one the pull request's author wrote — and a branch left to run its
          # own classifier could answer "documentation only" about its own
          # payload and skip every check that would have read it. `git diff`
          # still runs in this checkout, so the diff is this branch's; only the
          # judgement passing on it is `main`'s.
          #
          # A push to `main` has no base sha and needs none: what is in the tree
          # there arrived by a reviewed squash merge, so running the checkout's
          # own copy here is running `main`'s own, not a pull request's.
          if [ -z "$BASE_SHA" ]; then
            node scripts/what-changed.mjs
            exit 0
          fi
          base="$RUNNER_TEMP/base-classifier"
          mkdir -p "$base/lib"
          if git show "$BASE_SHA:scripts/what-changed.mjs" > "$base/what-changed.mjs" &&
             git show "$BASE_SHA:scripts/lib/what-changed.mjs" > "$base/lib/what-changed.mjs"; then
            node "$base/what-changed.mjs"
          else
            # True of the pull request that introduced the classifier, and of
            # nothing after it - or of `scripts/what-changed.mjs`'s own shape
            # having moved since. Either way, falling back to *this branch's
            # own copy* would be exactly the hole the base-commit extraction
            # above exists to close, so this fails open instead: no classifier
            # runs, and the mechanical jobs do.
            echo "::warning::The base commit carries no classifier, so every check runs rather than trusting this branch's own."
            echo "product_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Architecture §9.1 asks for the fast test tiers split one job per tier, so a
  # misplaced test is visible. Today Cockpit is one service with one test file,
  # and testing-strategy §2 is explicit that levels are roles rather than
  # mandatory folders ("do not invent tests or empty folders just to populate
  # the taxonomy"). So: real jobs only, split along the lines that exist now.
  # The per-tier split lands with the tiers.
  typecheck:
    name: Typecheck
    # Skipped on a documentation-only diff, and run on anything `changes` could
    # not read — see there.
    needs: changes
    if: ${{ !failure() && needs.changes.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # The lint layer ("Add the lint layer the code is already written against",
  # issue 282): the React Hooks rules, no focused test reaching `main`, and the
  # testing strategy's L1/F1 dependency table as restricted imports. Its own job
  # for the reason every other one here is — a failure that names itself — and
  # because it is the only check that fails on a `.only` somebody left in, which
  # otherwise turns the `Test` job green over a suite that ran one test.
  #
  # Two steps: the rules against the repository, then the config against text.
  # The second is what holds the `files` globs, which is where a lint config
  # actually goes wrong: a rule scoped one folder too wide passes the first step
  # for as long as nothing happens to break.
  lint:
    name: Lint
    # Documentation-only diffs skip this; see the `changes` job.
    needs: changes
    if: ${{ !failure() && needs.changes.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm test:lint

  test:
    name: Test
    # Documentation-only diffs skip this; see the `changes` job.
    needs: changes
    if: ${{ !failure() && needs.changes.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Instrumented (`test:coverage`, not plain `test`) so the suite runs once for
      # both the gate and `test-explorer`'s coverage columns, rather than once here
      # and again there ("Run the suite once in CI, not once to gate and once to
      # measure", issue 289). Uploaded because Actions jobs share no filesystem —
      # this artifact is the explicit hop `test-explorer` downloads instead of
      # re-running the suite.
      #
      # The globs mirror pnpm-workspace.yaml's own package roots rather than
      # naming the specific packages that happen to have a `test:coverage`
      # script today, so a package gaining one later is picked up here too
      # instead of silently missing from the artifact.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
            packages/connectors/*/coverage/coverage-final.json
            tools/*/coverage/coverage-final.json

  # F3, the browser tier. Its own job rather than part of `Test`, because it is
  # the one tier that boots the whole application (wrangler + local D1 + Vite)
  # and downloads a browser: folded into `Test` it would put minutes and a
  # browser install in front of every unit-test failure, and the CI/CD section
  # of the architecture (§9.1) wants a misplaced test visible as a job in any
  # case.
  #
  # This runs against the tier's own local stack (scripts/e2e-stack.mjs), which
  # is not quite the deployed shape — no service worker, unbundled modules,
  # Vite's SPA fallback rather than the Worker's asset routing. Those three break everything at once
  # rather than one feature at a time, and the intended cover for them is the
  # same suite pointed at a deployed environment (E2E_BASE_URL, per
  # playwright.config.ts). That run lands with "Run the F3 suite against a
  # deployed environment, as its own account" (issue 64); see the deferred item
  # in "Deferred, with reasons" (docs/deployment.md).
  e2e:
    name: E2E (F3)
    # Documentation-only diffs skip this; see the `changes` job. The 7.7 minutes
    # this tier costs is most of that job's argument.
    needs: changes
    if: ${{ !failure() && needs.changes.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Only Chromium: both Playwright projects (desktop and phone) are
      # Chromium, because this is a viewport and input matrix, not a browser
      # matrix. --with-deps because the runner lacks the shared libraries a
      # browser needs.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # Traces and screenshots are kept on failure only (playwright.config.ts),
      # so this uploads nothing of Playwright's on a green run.
      #
      # Wrangler's own log goes with them, and it is the half that matters when
      # the *stack* is what failed rather than a test. `wrangler dev` exited 1
      # mid-run on `main` at bc840bb, printing an empty error and taking Vite
      # down with it, so twenty-six tests failed with a connection refused and
      # every screenshot kept was of the same blank page. Wrangler had written
      # the reason to disk — outside the repository, on a runner that was then
      # deleted. `scripts/e2e-stack.mjs` now points it here instead.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            apps/api/.wrangler/logs-e2e/
          # A failure produces one of these or the other, rarely both: a test
          # that failed against a healthy stack leaves screenshots and a log
          # nobody needs, and a stack that died leaves a log and screenshots of
          # the same blank page. Missing is therefore normal, and the default
          # `warn` would put a warning on a job that is already red for a
          # reason it is not about to explain.
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    # Documentation-only diffs skip this; see the `changes` job.
    needs: changes
    if: ${{ !failure() && needs.changes.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The bundle gate (docs/architecture.md, "Performance budgets"): what a
      # cold open fetches stays under 200KB compressed, and so does any one
      # chunk fetched later, charged separately. Here rather than in its own job
      # because it measures what the line above emitted, and a second job would
      # have to build again to see it.
      - run: pnpm bundle:budget

  # **Ungated, though the issue behind the gate above listed it with the rest.**
  # Its last test reads the repository's Markdown — the writing rules of
  # CLAUDE.md — so it is the only check with anything to say about the very paths
  # the others skip on, and skipping it would take the prose gate off exactly the
  # pull requests it exists for. It is checkout-only and takes seconds, so gating
  # it would save nothing worth that hole.
  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # scripts/ is Node, and carries the logic that decides whether
      # a test run gets a fresh database, whether it is allowed to start at all,
      # whether either Claude review actually reached a verdict, and whether
      # a browser walk changes workspace the way that waits — worth
      # asserting rather than trusting. The review gate is the one with teeth: it is what turns a blocked or
      # declining review red, and while the code review's half of it was inline
      # bash in claude-code-review.yml it shipped green over a non-review four
      # times. The last two are here because they read source text rather than
      # running anything, so no other tier can check them and this job can: the
      # walks' conventions, and the writing rules of CLAUDE.md that a script can
      # decide, which were costing a review round each. The classifier the
      # `changes` job above runs is asserted here too, which is why a mistake in
      # it cannot skip its own test.
      # No install step: these tests use only node:test and the standard
      # library, so this job stays checkout-only and finishes in seconds.
      - name: Verify the dev, test-stack, health-check, review-gate and what-changed scripts, the walks' conventions and the writing rules
        run: node --test scripts/lib/*.test.mjs

  # The cheap third of the report pipeline: fails on a feature area a test declares
  # that concepts.json does not register, the only one of the three checks here that
  # fails for a reason somebody has to fix. Its own job with no `needs`, so it stays
  # fast and independent rather than waiting on `test`'s instrumented run — nothing
  # about it requires coverage ("Run the suite once in CI, not once to gate and once
  # to measure", issue 289).
  test-explorer-check:
    name: Concepts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test:explorer:check

  # Publishes which product concepts own which tests: as a downloadable
  # artifact on every run, and — from `main` only — as the page the `pages` job
  # below deploys. Does not gate: docs/test-explorer-spec.md's "CLI, scripts,
  # CI" (§8) deliberately stops short of failing the build on the report's
  # content, only on concepts.json drift, which `test-explorer-check` guards.
  #
  # `needs: [test, test-explorer-check]` rather than running either itself: the
  # coverage this job renders as "branches nothing takes" is `test`'s own
  # instrumented run, downloaded as an artifact instead of collected again, and
  # a red suite or a registry drift already kills the report the way it always
  # has — this job simply never starts. On a documentation-only diff `test` is
  # skipped rather than failed, and a skipped dependency is not a successful
  # one, so this job (and `pages` behind it) is skipped too, by the same
  # `needs` chain rather than a gate of its own — the second thing this
  # regains, along with the artifact hop, that a stale rewrite of this file
  # once dropped ("Skip the mechanical checks on a pull request that touches
  # nothing they cover", issue 345).
  test-explorer:
    name: Test Explorer
    needs: [test, test-explorer-check]
    runs-on: ubuntu-latest
    # download-artifact reads this run's own artifacts through the Actions API,
    # which the workflow-level block withholds by default — the same reason
    # `pages` below declares it.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Download the coverage `test` already collected
        uses: actions/download-artifact@v4
        # Missing rather than failed: if `test:coverage` ran but somehow wrote
        # no `coverage-final.json` anywhere, `test` still succeeded and no
        # artifact exists to download. Continuing without it degrades the
        # report to "unknown" coverage columns — tools/test-explorer's own
        # designed fallback — rather than failing this advisory job outright.
        continue-on-error: true
        with:
          name: coverage-reports
          path: .
      - run: pnpm test:explorer
      # Kept on every branch, and not replaced by the published page: it is how
      # a pull request's own report gets read, and the fallback when a deploy
      # fails.
      - uses: actions/upload-artifact@v4
        with:
          name: test-explorer-report
          path: tools/test-explorer/out/

  # How reliable each job on `main` has been: pass rates over 7 and 30 days with
  # cancellations counted apart from failures, durations, how long `main` stayed
  # red, and the recent failures linked to the step they died on ("See how
  # reliable each CI job on main is, without counting runs by hand", issue 244).
  #
  # Its own job rather than a step of `test-explorer`, which now needs `test`'s
  # instrumented run and is skipped whenever it fails: folding this in would take
  # down the page whose purpose is reporting suite failures, at the one moment it
  # is worth reading.
  #
  # No install step, for the reason `scripts` gives — it reads the API with the
  # standard library and has no dependencies to fetch.
  #
  # `main` only, and not because a branch's report would be published (the
  # `pages` job below is what decides that): a report costs hundreds of API
  # requests against an hourly allowance every workflow here shares, worked out
  # in `tools/ci-stability/src/github.js`. What proves the generator on a branch
  # is its own suite, which stubs the API.
  stability:
    name: Stability
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Reads the Actions API, which the workflow-level block withholds by
    # default. Nothing else, and no write anywhere.
    permissions:
      contents: read
      actions: read
    # Advisory, exactly as the test explorer is: a report that cannot be built
    # is a missing page, not a broken `main`. This is also what stops a spent
    # rate limit taking the explorer's publish down with it — `pages` below
    # gates on `test-explorer` alone.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Measure how reliable each job on main has been
        run: node tools/ci-stability/src/cli.js --out tools/ci-stability/out/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-stability-report
          path: tools/ci-stability/out/

  # The reports from the tip of `main`, at a fixed URL, readable without signing
  # in — which is what a zipped artifact is not, least of all on a phone, where
  # the GitHub app has never downloaded one in-app ("Publish the test explorer
  # at a URL, instead of a zip you have to download", issue 224).
  #
  # A separate job because `deploy-pages` needs write access to Pages and an
  # OIDC token, which the workflow-level block above withholds from everything
  # else. It deploys what `test-explorer` already generated rather than
  # generating again, so the instrumented suite still runs exactly once.
  #
  # **Pages must be switched on for the repository** (Settings → Pages →
  # Source: GitHub Actions), as docs/deployment.md records under "Then, by hand".
  # Until it is, this job fails and takes main's CI red with it. Not automated
  # with `configure-pages`'s `enablement`: that input cannot use `GITHUB_TOKEN`
  # and wants a stored PAT, which is a worse trade than one settings click.
  pages:
    name: Publish
    needs: [test-explorer, stability]
    # `!cancelled()` rather than the bare ref test, because `needs` on a failed
    # job would otherwise skip this one: the stability report is allowed to fail
    # and the site still publishes without it. The explorer is not — it is the
    # page, so its result is named explicitly.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test-explorer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # download-artifact reads this run's own artifacts through the Actions API.
      actions: read
    # Names the deployment in the GitHub UI, and is where the URL is shown.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # One deploy at a time, and never cancel one that has started — a group
    # holds only one *pending* job, so a third arrival cancels the second
    # rather than queueing behind it. It does little on a merge, where the
    # workflow-level group above already cancels the whole superseded run, this
    # job with it; it is here for deploys arriving by another route, a re-run or
    # a dispatch. A lost deploy costs that commit's page and nothing else: a
    # Pages deployment either replaces the live one or does not happen, and the
    # next merge publishes the same page one commit later.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # The site is two reports, so it is assembled here rather than uploaded by
      # whichever job finished last: the explorer at the root, the stability
      # page one directory down at /stability/. Both stay downloadable on their
      # own as the artifacts the jobs above uploaded.
      - name: Take the test explorer's report
        uses: actions/download-artifact@v4
        with:
          name: test-explorer-report
          path: site/
      - name: Take the stability report, if there is one
        uses: actions/download-artifact@v4
        # There is no artifact when the stability job's fetch was refused, and
        # download-artifact treats a missing one as an error. Publishing the
        # explorer without the stability page beats publishing neither.
        continue-on-error: true
        with:
          name: ci-stability-report
          path: site/stability/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v4
