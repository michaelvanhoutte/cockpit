name: Contract

# The tier that talks to the real third parties - Claude, the Workers AI models
# that read what a note means and transcribe a recording, and the Bot Framework's published signing keys
# (docs/testing-strategy.md, "Third parties"):
# everything below it runs against a fake, and this is what says the fake still
# resembles the thing. The tier runs when the half of the contract we own
# changes, which is a prompt, weekly, and by hand from the Actions tab. Claude
# is asked once per prompt (about five calls), so the weekly run carries the
# Claude key and a change on Anthropic's side shows within a week with no pull
# request. What each prompt is held to - its behaviour suite, about a hundred
# calls - is never selected here: it runs only when named, by hand, by whoever
# changes that prompt (.claude/skills/testing/SKILL.md).
#
# Not a required check: while it can fail for a reason the change did not cause
# ("Make the nightly contract run pass again", issue 705), it reports drift on the pull request without blocking a merge.
on:
  pull_request:
    paths:
      - 'apps/api/src/ai/**'
      - 'apps/api/src/transcription/**'
      - 'apps/api/tests/contract/**'
      - 'packages/connectors/gmail/tests/contract/**'
      - 'packages/connectors/outlook/tests/contract/**'
      - 'apps/api/vitest.contract.config.ts'
      - '.github/workflows/contract.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    env:
      # Where each Vitest run leaves the tests that failed in it
      # (scripts/lib/vitest-session-reporter.mjs), absolute because pnpm runs
      # each package from its own folder.
      COCKPIT_FAILED_TESTS_DIR: ${{ github.workspace }}/failed-tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The connector's own contract suite: what Microsoft publishes for
      # checking a saved Teams message, asked of Microsoft ("Save a Teams
      # message to Cockpit", issue 486). No secret - the Bot Framework's
      # signing keys are published to anyone - and first, because a failure
      # here costs nothing and a failure below costs the model's time.
      - run: pnpm --filter @cockpit/connector-teams test:contract
      # Gmail's own, in its connector package ("Build Gmail as a connector
      # package on the SDK, unregistered", issue 943): a dedicated test mailbox
      # ("Bring in the conversations already labelled Cockpit as tasks", issue
      # 725), and a skip, not a failure, without it - until somebody provisions
      # the mailbox, a skip is the honest answer (docs/deployment.md, "A Google
      # Cloud project for Gmail"). Free, so it runs weekly too.
      - run: pnpm --filter @cockpit/connector-gmail test:contract
        env:
          GMAIL_CONTRACT_CLIENT_ID: ${{ secrets.GMAIL_CONTRACT_CLIENT_ID }}
          GMAIL_CONTRACT_CLIENT_SECRET: ${{ secrets.GMAIL_CONTRACT_CLIENT_SECRET }}
          GMAIL_CONTRACT_REFRESH_TOKEN: ${{ secrets.GMAIL_CONTRACT_REFRESH_TOKEN }}
      # Outlook's own, in its connector package ("Build Outlook as a connector
      # package on the SDK, unregistered", issue 1046): a dedicated Microsoft
      # 365 test mailbox, and a skip, not a failure, without it. Free, so it
      # runs weekly too.
      - run: pnpm --filter @cockpit/connector-outlook test:contract
        env:
          OUTLOOK_CONTRACT_CLIENT_ID: ${{ secrets.OUTLOOK_CONTRACT_CLIENT_ID }}
          OUTLOOK_CONTRACT_CLIENT_SECRET: ${{ secrets.OUTLOOK_CONTRACT_CLIENT_SECRET }}
          OUTLOOK_CONTRACT_REFRESH_TOKEN: ${{ secrets.OUTLOOK_CONTRACT_REFRESH_TOKEN }}
      # A missing secret presents as a workflow that goes green having done
      # nothing, which is the failure docs/deployment.md records for
      # `CLAUDE_CODE_OAUTH_TOKEN`. Each suite itself refuses to run without its
      # own credential (tests/contract/), so this only names the secrets; it
      # does not print them. The Cloudflare pair is the same pair the deploy
      # workflows already use, and is what reads what a note means - which needs
      # Workers AI: Read on that token beside the scopes a deploy needs
      # (docs/deployment.md, "Bootstrap runbook").
      #
      # Every run, the weekly one included, names no suite: one call per Claude
      # prompt, and the two near-free Workers AI suites (meaning, and Whisper, a
      # few seconds of audio at $0.0005 a minute). A behaviour suite is never
      # selected without being named, which is what keeps the Claude key off a
      # hundred calls (scripts/lib/contract-selection.mjs).
      #
      # Every Claude call is recorded in production as CI, with this run and,
      # on a pull request, its number ("Record every Claude call a contract run
      # makes, as CI or local", issue 1459): USAGE_RECORDING_TOKEN is CI's
      # token, production's USAGE_TOKEN_CI. The address it is sent to is
      # production's own, read from wrangler.jsonc by the contract config. A key
      # without the token is red before any call.
      - run: pnpm --filter @cockpit/api test:contract
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAGE_RECORDING_TOKEN: ${{ secrets.USAGE_TOKEN_CI }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The failed tests by name, for CI stability: a record only where some
      # failed, and it can only add - the job stays what the tests made it. A
      # failing suite stops the steps after it, so the record names that one's.
      - name: Gather the failed tests
        if: ${{ failure() }}
        run: node scripts/ci-failed-tests.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: failed-tests-record
          path: failed-tests-record/record.json
          if-no-files-found: ignore
          retention-days: 30
