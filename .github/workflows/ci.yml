name: CI

# Push, but only on `main`. `pull_request` tests the merge result, which is
# what actually lands, so it is the only event that checks an open branch —
# scoping push everywhere used to check a branch's tip a second time, and the
# two disagreed on 13 of 155 such commits across the pull requests merged
# 6–9 September ("Validate a commit once, not twice by CI and again for
# every clean merge of main", issue 311).
#
# **A branch with no open pull request is therefore checked by nothing.**
# That gap is why push used to run everywhere: deploy-preview.yml ran the same
# checks on branch pushes on its way to building a preview, and without it an
# unreviewed branch would be gated by nothing at all. That workflow is gone
# (docs/deployment.md, "No branch environments"); the gap it leaves is
# accepted rather than closed, because /build's own process already runs
# typecheck, lint, the tests and a browser pass by hand throughout a unit of
# work, and opens the pull request only once that is already done.
#
# The push-to-main trigger overlaps slightly with deploy-staging.yml, which
# gates itself before deploying. That is deliberate: the merge commit on main
# is a tree that has never been tested as such, and the jobs below attribute
# a failure faster than the same checks inlined into a deploy job.
on:
  push:
    branches: [main]
  # A pull request into a `feature/` branch is checked as one into `main` is,
  # so work built in several pull requests on a feature branch before it
  # lands is gated at each one. The selection below reads its base off the
  # merge commit, so it diffs against the feature branch, not `main`.
  pull_request:
    branches: [main, 'feature/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default, because declaring any permissions block sets every scope
# not listed to `none` (the same mechanism codeql.yml documents). Without this
# every job here runs on whatever the repository's default token grants, which
# is `pages: write` and `contents: write` where the default is read-and-write —
# held by jobs that run arbitrary package code. `pages` below re-grants itself
# what it needs, and nothing else in this file gets it.
permissions:
  contents: read

jobs:
  # Six jobs used to bill a runner start-up each for under a minute of real
  # work — 5, 57, 26, 28, 27 and 8 seconds on pull request 362's last run for
  # What changed, Typecheck, Lint, Build, Concepts and Scripts, six minutes of
  # a 22-minute run for two of it ("Run the six small CI jobs as one, so a
  # push stops paying six runner start-ups", issue 378). This job carries all
  # six as steps instead, in the order below, so a push pays for one runner
  # rather than six. CodeQL is not gated on any of this: it no longer runs on
  # a pull request at all ("Decide whether CodeQL earns its run on every pull
  # request push, or moves to main and a schedule", issue 379), so there is no
  # diff here for it to be gated on.
  #
  # Only the last five steps — Typecheck, Lint, Verify the lint config, Build
  # and the bundle budget — are gated on the classifier: a skipped *step*
  # satisfies a required check exactly as a skipped job did, so a
  # documentation-only pull request still runs Scripts and Concepts (which
  # read the prose and the registry those five skip on) and reports this job
  # green. The decision is
  # scripts/lib/what-changed.mjs, asserted by the Scripts step itself:
  # `docs/`, `.claude/` and root-level `*.md` are the only paths that skip,
  # and anything else runs the lot.
  #
  # `Test` and `E2E (F3)` stay their own jobs — their cost is the work itself,
  # not the start-up (issue 378's own "Out of scope") — and run the same
  # classifier action themselves rather than waiting on this job's, so all of
  # them start with the run ("Run the E2E (F3) job as four shards under one
  # required check, starting alongside Checks", issue 1279).
  # `Concepts`, `Test Explorer`, `Stability` and `Publish` still gate nothing
  # of their own; `docs/architecture.md` §9.1 says why.
  #
  # This closes one gap in what a pull request's own head can influence — the
  # classifier's decision — and not the wider one: `pull_request` still builds
  # this very workflow file from the merge ref, so a branch with write access
  # could edit this job's `if:` conditions directly. Pinning the classifier
  # closes the quiet route; it was never going to close the loud one, which
  # every workflow file in this repository already trusts required checks
  # over.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` because the classifier's diff reaches back to the
      # base commit, and the whole history is 8MB packed. One checkout for
      # every step below, so a step that used to run in its own job now reads
      # this same tree instead of fetching its own.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the product
        id: classify
        uses: ./.github/actions/classify
        continue-on-error: true
      # **Both steps above are `continue-on-error`**, so a failure inside
      # either one leaves `product_changed` unwritten and the gate's
      # `!= 'false'` below still runs everything - the dangerous direction is
      # a skip nobody meant.
      #
      # Reads the repository's own prose (readme.md's writing rules, via
      # scripts/lib/writing-rules.mjs) and the scripts that decide whether a
      # test run gets a fresh database, whether it is allowed to start at all,
      # whether either Claude review reached a verdict, and whether a browser
      # walk changes workspace the way that waits — worth asserting rather
      # than trusting, and this job's own classifier is asserted here too, so
      # a mistake in it cannot skip its own test. Ungated, deliberately: it is
      # the only step with anything to say about the very paths the gate
      # below skips on, and skipping it would take the prose gate off exactly
      # the diffs it exists for. No install before it — these tests use only
      # node:test and the standard library.
      - name: Scripts
        run: node --test scripts/lib/*.test.mjs
      # `!cancelled()` from here down, on every step: a step's own `if:`
      # replaces GitHub's implicit `success()` rather than joining it, so
      # without this a Scripts failure - unrelated to install, Concepts,
      # Typecheck, Lint or Build - would silently skip all of them, where five
      # separate jobs used to let each report on its own regardless of the
      # others. The five gated steps still skip on a documentation-only diff,
      # same as before, via the second half of each condition.
      - uses: ./.github/actions/setup
        if: ${{ !cancelled() }}
      # The cheap third of the report pipeline: fails on a feature area a test
      # declares that concepts.json does not register, the only one of the
      # three report-pipeline checks that fails for a reason somebody has to
      # fix. Ungated and ahead of the five gated steps below, so it stays fast
      # and reports on a documentation-only diff too, independent of whether
      # anything downstream skips.
      - name: Concepts
        if: ${{ !cancelled() }}
        run: pnpm test:explorer:check
      # Architecture §9.1 asks for the fast tiers split one job per tier, so a
      # misplaced test is visible; the five steps below are what is left once
      # What changed, Concepts and Scripts move above them into this same job.
      #
      # Skipped on a documentation-only diff, and run on anything the
      # classifier above could not read — see its own comment.
      - name: Typecheck
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        run: pnpm typecheck
      # The lint layer ("Add the lint layer the code is already written against",
      # issue 282): the React Hooks rules, no focused test reaching `main`, and the
      # testing strategy's L1/F1 dependency table as restricted imports. Its own
      # step for the reason every one here is — a failure that names itself — and
      # because it is the only check that fails on a `.only` somebody left in, which
      # otherwise turns `Test` green over a suite that ran one test.
      #
      # Two steps: the rules against the repository, then the config against text.
      # The second is what holds the `files` globs, which is where a lint config
      # actually goes wrong: a rule scoped one folder too wide passes the first step
      # for as long as nothing happens to break.
      - name: Lint
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        run: pnpm lint
      - name: Verify the lint config
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        run: pnpm test:lint
      # The test runners recording their own runs on a session record: real
      # Vitest, Playwright and Node runs, so after the install, unlike Scripts.
      - name: Runners
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        run: pnpm test:runners
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        run: pnpm build
      # The bundle gate (docs/architecture.md, "Performance budgets"): what a
      # cold open fetches stays under 201KB compressed, and so does any one
      # chunk fetched later, charged separately. Its own step rather than
      # part of Build because it measures what that step emitted, and gating
      # it separately from the classifier's condition would build twice to
      # see it.
      #
      # Gated on Build's own outcome, not `!cancelled()` and the classifier
      # again: this step reads `apps/web/dist`, which only exists once Build
      # has actually succeeded, so the same `!cancelled()` the other gated
      # steps use would run this against a missing or stale build after a
      # real Build failure - a second, misleading red step over the same
      # compile error. `steps.build.outcome == 'success'` is false both when
      # Build failed for real and when it was skipped on a documentation-only
      # diff, so this needs no separate classifier check of its own.
      - name: Bundle budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm bundle:budget

  # On a pull request this runs only the tests that depend on what changed
  # since the merge-base with `main` (scripts/ci-test.mjs, scripts/lib/test-selection.mjs,
  # scripts/lib/workspace.mjs) - the point being proved is that affected-selection scales as the suite
  # grows, not that any one run is faster today ("Run only the affected tests
  # in CI's Test job on a pull request", issue 346).
  #
  # testing-strategy.md's "Definition of done for agents" section (§6) requires
  # the fast tiers in full, with no selection - unaffected by this, since that
  # rule is about what an agent runs *locally* before claiming a change works
  # (`pnpm test`, untouched here) and is backstopped by CI regardless of what
  # was run by hand. That backstop is this job, and it still has to actually
  # run everything at some point rather than trust a diff - which is why a push
  # to `main` runs every package in full unconditionally: it is the actual gate
  # before staging, and a diff computed there against its own squash-merge
  # parent would just reproduce the same small set the pull request already ran.
  #
  # fetch-depth: 0 is what makes the merge-base computable at all - see
  # ci-test.mjs's own comment for why no other ref is needed.
  #
  # Instrumented (`test:coverage`) on a push to `main` only, so the suite runs
  # once for both the gate and `test-explorer`'s coverage columns rather than
  # once here and again there ("Run the suite once in CI, not once to gate and
  # once to measure", issue 289). A pull request runs plain `test`: its report
  # is never published and nothing gates on the numbers, so instrumenting it
  # was cost for nobody ("Stop instrumenting coverage on a pull request's test
  # run", issue 508). scripts/lib/test-selection.mjs makes the choice, and a
  # pull request's `test-explorer` renders "unknown" coverage columns, its own
  # designed fallback. Uploaded because Actions jobs share no filesystem - this
  # artifact is the explicit hop `test-explorer` downloads instead of
  # re-running the suite.
  #
  # Classifies the diff itself, so it starts with the run instead of when
  # `checks` ends, and skips its steps on a documentation-only diff as `checks`
  # does (a skipped step satisfies the required check, so the job is green). Its
  # `product_changed` output is what keeps `test-explorer`, which needs it,
  # skipped on such a diff.
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      product_changed: ${{ steps.classify.outputs.product_changed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the product
        id: classify
        uses: ./.github/actions/classify
        continue-on-error: true
      - uses: ./.github/actions/setup
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
      # A passing run takes about ten minutes. The cap turns a suite that has
      # passed and then never exits into a failure in minutes rather than
      # GitHub's six hours (apps/api/vitest.config.ts, `disableConsoleIntercept`).
      - run: node scripts/ci-test.mjs
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
        timeout-minutes: 25
      # What this run selected and why (scripts/lib/test-record.mjs), on every run
      # and whatever the tests did. It can only add: the step is allowed to fail
      # without failing the job, and it runs after the tests have decided the
      # job's result, so recording never changes the outcome (issue 539).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        continue-on-error: true
        with:
          name: test-selection-record
          path: test-record/record.json
          if-no-files-found: warn
      # `main` only: a pull request's uninstrumented run writes no coverage, and
      # an upload of nothing would put a warning on every green run.
      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'push' && steps.classify.outputs.product_changed != 'false' }}
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/coverage-final.json
            packages/*/coverage/coverage-final.json
            packages/connectors/*/coverage/coverage-final.json
            tools/*/coverage/coverage-final.json

  # F3, the browser tier. Its own job rather than part of `Test`, because it is
  # the one tier that boots the whole application (wrangler + local D1 + Vite)
  # and downloads a browser: folded into `Test` it would put minutes and a
  # browser install in front of every unit-test failure, and the CI/CD section
  # of the architecture (§9.1) wants a misplaced test visible as a job in any
  # case.
  #
  # This runs against the tier's own local stack (scripts/e2e-stack.mjs), which
  # is not quite the deployed shape — no service worker, unbundled modules,
  # Vite's SPA fallback rather than the Worker's asset routing. Those three break everything at once
  # rather than one feature at a time, and the intended cover for them is the
  # same suite pointed at a deployed environment (E2E_BASE_URL, per
  # playwright.config.ts). That run lands with "Run the F3 suite against a
  # deployed environment, as its own account" (issue 64); see the deferred item
  # in "Deferred, with reasons" (docs/deployment.md).
  #
  # **Four shards, and a fan-in that is the required check** ("Run the E2E (F3)
  # job as four shards under one required check, starting alongside Checks",
  # issue 1279). This job is the matrix: each shard is a runner with its own
  # stack, and Playwright deals the walks across them one by one
  # (scripts/ci-e2e.mjs, E2E_SHARD). Their names, `E2E (F3) (1)` to `(4)`, are
  # what the cycle-time and stability reports read as one family with the
  # fan-in below, which is named for the family and is what branch protection
  # requires, so neither it nor the deployment runbook names a shard.
  #
  # The matrix lists the same shards as `E2E_SHARDS` in
  # scripts/lib/e2e-record.mjs, which a test holds together. `fail-fast` is off
  # so one red shard does not cancel the other three: each still reports its
  # own walks.
  #
  # Each shard classifies the diff itself, like `Test`, so it starts with the
  # run, and skips its steps on a documentation-only diff: no install, no
  # Chromium, and a green job.
  e2e:
    name: E2E (F3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the product
        id: classify
        uses: ./.github/actions/classify
        continue-on-error: true
      - uses: ./.github/actions/setup
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
      # The walks-per-area budget, ahead of the browser download and the tier itself
      # ("Bring the browser tier back inside a budget", issue 509): `--list`
      # loads the specs and reports what would run, which needs no browser and
      # no stack. A breach is a decision to take rather than a failure to
      # diagnose, so half a minute here beats thirteen. Every shard runs it, in
      # about four seconds, rather than one job upstream of them.
      - name: Walks per area
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
        run: pnpm test:e2e:ceilings
      # Only Chromium: both Playwright projects (desktop and phone) are
      # Chromium, because this is a viewport and input matrix, not a browser
      # matrix. --with-deps because the runner lacks the shared libraries a
      # browser needs.
      - name: Install Chromium
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
        run: pnpm exec playwright install --with-deps chromium
      # On a pull request this runs only the areas that own a changed file
      # (scripts/lib/e2e-selection.mjs); a push to `main` runs every walk, as
      # the `Test` job does. `fetch-depth: 0` is what places the merge-base.
      # Either way this shard runs its share of the walks, and a shard dealt
      # none passes.
      - name: Run this shard's walks
        if: ${{ steps.classify.outputs.product_changed != 'false' }}
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node scripts/ci-e2e.mjs
      # The tier's time budget for one shard ("Hold each E2E shard's walks under
      # a tier-wide time budget", issue 1280): fails with the number, the shard
      # and the duration when this shard's walks ran past
      # `e2eShardBudget` in tools/test-explorer/concepts.json. It reads
      # Playwright's own reported duration from the report the step above wrote,
      # never this job's wall clock, which carries the Chromium install and the
      # runner's start-up. `success()` is the default, stated because the steps
      # around it are `!cancelled()`: a shard whose walks failed shows that one
      # red and not a second one from here.
      - name: Hold this shard's walks to the time budget
        if: ${{ success() && steps.classify.outputs.product_changed != 'false' }}
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm test:e2e:budget
      # What this shard selected and ran (scripts/lib/e2e-record.mjs), on every
      # run and whatever the walks did, and it can only add: the same rule as
      # the `Test` job's record ("Show E2E in the test selection report", issue
      # 541). Under a name of its own, because `e2e-selection-record` is the
      # fan-in's merged record alone: the reports match that name to the job
      # that uploaded it.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.classify.outputs.product_changed != 'false' }}
        continue-on-error: true
        with:
          name: e2e-selection-record-${{ matrix.shard }}
          path: e2e-record/record.json
          if-no-files-found: warn
          # A re-run of this shard alone uploads under the first attempt's name,
          # which v4 otherwise refuses, leaving the fan-in the failed record.
          overwrite: true
      # Traces and screenshots are kept on failure only (playwright.config.ts),
      # so this uploads nothing of Playwright's on a green run.
      #
      # Wrangler's own log goes with them, and it is the half that matters when
      # the *stack* is what failed rather than a test. `wrangler dev` exited 1
      # mid-run on `main` at bc840bb, printing an empty error and taking Vite
      # down with it, so twenty-six tests failed with a connection refused and
      # every screenshot kept was of the same blank page. Wrangler had written
      # the reason to disk — outside the repository, on a runner that was then
      # deleted. `scripts/e2e-stack.mjs` now points it here instead.
      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: |
            test-results/
            apps/api/.wrangler/logs-e2e/
          # A failure produces one of these or the other, rarely both: a test
          # that failed against a healthy stack leaves screenshots and a log
          # nobody needs, and a stack that died leaves a log and screenshots of
          # the same blank page. Missing is therefore normal, and the default
          # `warn` would put a warning on a job that is already red for a
          # reason it is not about to explain.
          if-no-files-found: ignore
          retention-days: 7

  # The required check, named for the family the shards belong to. It answers
  # for them: red where any shard failed or was cancelled, green otherwise,
  # including on a documentation-only diff where each shard skipped its steps.
  # `!cancelled()` rather than the default, since `needs` on a failed shard
  # would skip it and a skipped required check passes; a run cancelled by a
  # newer push is not worth a runner, and its shards are cancelled with it.
  #
  # Merges the shards' records into one and uploads it as `e2e-selection-record`,
  # the name the selection report and the cycle-time report have always read, so
  # neither learns about shards. Reads each shard's result off the run's jobs, to
  # name the one that failed: `needs.e2e.result` is only the matrix's aggregate.
  # Re-running one failed shard re-runs this job too, which then re-reads.
  e2e-result:
    name: E2E (F3)
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Reads the run's own artifacts and jobs through the Actions API, which the
    # workflow-level block withholds by default.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Missing rather than failed: a documentation-only diff leaves no record,
      # and a shard that died before uploading one is named by the merge.
      - name: Download the shards' records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-selection-record-*
          path: e2e-shard-records
      - name: Merge the records and answer for the shards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_SHARDS_RESULT: ${{ needs.e2e.result }}
        run: node scripts/ci-e2e-fan-in.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: e2e-selection-record
          path: e2e-record/record.json
          if-no-files-found: ignore
          # The fan-in re-runs with a re-run shard and replaces the merged record.
          overwrite: true

  # The Android widget (apps/android-widget): built and tested only when a file
  # it reads changed (scripts/lib/what-changed.mjs, `widgetChanged`), so the
  # many pull requests that never touch it pay for no Gradle run. Its own job
  # because it needs Java and the Android SDK where the rest need Node, and
  # because it is the one place a Kotlin test can run (docs/testing-strategy.md,
  # "The Android widget").
  #
  # Runs on anything the classifier could not answer: `widget_changed` is unset
  # then, and also while the base commit's classifier predates the output, which
  # `!= 'false'` reads as "yes". The release is a different workflow, on a tag
  # (widget-release.yml). Not a required check until the owner adds it to
  # `.github/branch-protection.json`.
  widget:
    name: Widget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the widget
        id: classify
        uses: ./.github/actions/classify
        continue-on-error: true
      - uses: actions/setup-java@v4
        if: ${{ steps.classify.outputs.widget_changed != 'false' }}
        with:
          distribution: temurin
          java-version: '17'
      # Caches Gradle's downloads, and refuses a wrapper jar that is not Gradle's own.
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ steps.classify.outputs.widget_changed != 'false' }}
      # Both builds, so a flavour that stops compiling is seen, but the tests once: the
      # flavours differ only in constants, and a bare `test` would run every Robolectric
      # suite four times. The JVM unit tests and Robolectric against a fake Cockpit.
      - name: Test and build the widget
        if: ${{ steps.classify.outputs.widget_changed != 'false' }}
        working-directory: apps/android-widget
        run: bash ./gradlew --no-daemon testStagingDebugUnitTest lintStagingDebug assembleStagingDebug assembleProductionDebug
      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: widget-reports
          path: apps/android-widget/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes which product concepts own which tests: as a downloadable
  # artifact on every run, and — from `main` only — as the page the `pages` job
  # below deploys. Does not gate: docs/test-explorer-spec.md's "CLI, scripts,
  # CI" (§8) deliberately stops short of failing the build on the report's
  # content, only on concepts.json drift, which the Concepts step of `checks`
  # guards.
  #
  # `needs: [test, checks]` rather than running either itself: the coverage
  # this job renders as "branches nothing takes" is `test`'s own instrumented
  # run on `main`, downloaded as an artifact instead of collected again (a pull
  # request has none and renders "unknown"), and a red
  # suite or a registry drift already kills the report the way it always has
  # — this job simply never starts. On a documentation-only diff `test`
  # skips its steps and is green, and its `product_changed` output is what
  # skips this job (and `pages` behind it) too — the second thing this
  # regains, along with the artifact hop, that a stale rewrite of this file
  # once dropped ("Skip the mechanical checks on a pull request that touches
  # nothing they cover", issue 345). One consequence of `checks` now also
  # carrying Typecheck, Lint and Build: a red one of those fails `checks`
  # outright, which now takes the report down with it too, rather than
  # leaving it to publish over an unrelated failure the way it used to when
  # Concepts was its own job.
  test-explorer:
    name: Test Explorer
    needs: [test, checks]
    if: ${{ success() && needs.test.outputs.product_changed != 'false' }}
    runs-on: ubuntu-latest
    # download-artifact reads this run's own artifacts through the Actions API,
    # which the workflow-level block withholds by default — the same reason
    # `pages` below declares it.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Download the coverage `test` already collected
        uses: actions/download-artifact@v4
        # `main` only, matching the upload in `test`: a pull request's `test` is
        # uninstrumented and uploads nothing, so a download there would show a
        # red step on every run. Its report reads "unknown" coverage columns
        # without it.
        if: ${{ success() && github.event_name == 'push' }}
        # Missing rather than failed: on `main`, a `test:coverage` that somehow
        # wrote no `coverage-final.json` leaves no artifact either. Continuing
        # without it degrades the report to "unknown" coverage columns —
        # tools/test-explorer's own designed fallback — rather than failing this
        # advisory job outright.
        continue-on-error: true
        with:
          name: coverage-reports
          path: .
      - run: pnpm test:explorer
      # Kept on every branch, and not replaced by the published page: it is how
      # a pull request's own report gets read, and the fallback when a deploy
      # fails.
      - uses: actions/upload-artifact@v4
        with:
          name: test-explorer-report
          path: tools/test-explorer/out/

  # How reliable each job on `main` has been: pass rates over 7 and 30 days with
  # cancellations counted apart from failures, durations, how long `main` stayed
  # red, and the recent failures linked to the step they died on ("See how
  # reliable each CI job on main is, without counting runs by hand", issue 244).
  #
  # Its own job rather than a step of `test-explorer`, which now needs `test`'s
  # instrumented run and is skipped whenever it fails: folding this in would take
  # down the page whose purpose is reporting suite failures, at the one moment it
  # is worth reading.
  #
  # No install step, for the reason the Scripts step of `checks` gives — it
  # reads the API with the standard library and has no dependencies to fetch.
  #
  # `main` only, and not because a branch's report would be published (the
  # `pages` job below is what decides that): a report costs hundreds of API
  # requests against an hourly allowance every workflow here shares, worked out
  # in `tools/ci-stability/src/github.js`. What proves the generator on a branch
  # is its own suite, which stubs the API.
  stability:
    name: Stability
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Reads the Actions API, which the workflow-level block withholds by
    # default. Nothing else, and no write anywhere.
    permissions:
      contents: read
      actions: read
    # Advisory, exactly as the test explorer is: a report that cannot be built
    # is a missing page, not a broken `main`. This is also what stops a spent
    # rate limit taking the explorer's publish down with it — `pages` below
    # gates on `test-explorer` alone.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Measure how reliable each job on main has been
        run: node tools/ci-stability/src/cli.js --out tools/ci-stability/out/index.html --model tools/ci-stability/out/model.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ci-stability-report
          path: tools/ci-stability/out/

  # The reports from the tip of `main`, at a fixed URL, readable without signing
  # in — which is what a zipped artifact is not, least of all on a phone, where
  # the GitHub app has never downloaded one in-app ("Publish the test explorer
  # at a URL, instead of a zip you have to download", issue 224).
  #
  # publish.yml does the actual fetch-and-deploy, shared with nightly.yml's own
  # call to it, so either a merge or a nightly run can put a report live
  # ("Publish nightly's reports the same night, and make a manual run go live
  # too", issue 563).
  #
  # **Pages must be switched on for the repository** (Settings → Pages →
  # Source: GitHub Actions), as docs/deployment.md records under "Then, by hand".
  # Until it is, this fails and takes main's CI red with it. Not automated with
  # `configure-pages`'s `enablement`: that input cannot use `GITHUB_TOKEN` and
  # wants a stored PAT, which is a worse trade than one settings click.
  pages:
    name: Publish
    needs: [test-explorer, stability]
    # `!cancelled()` rather than the bare ref test, because `needs` on a failed
    # job would otherwise skip this one: the stability report is allowed to fail
    # and the site still publishes without it. The explorer is not — it is the
    # page, so its result is named explicitly.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test-explorer.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: ./.github/workflows/publish.yml
