name: Cycle time backfill

# Sends an older window of merged pull requests to the Harness Monitor, which
# the `Cycle time` job in nightly.yml otherwise feeds from the newest merge it
# holds. Run by hand from the Actions tab, because the write key lives only in
# repository secrets (docs/deployment.md, "The Harness Monitor", says how to
# cover 90 days). Sending a window twice stores each pull request once. With
# `timelines-only` it sends each pull request's timeline alone, stored beside the
# pull request the Monitor holds, which it never replaces.
on:
  workflow_dispatch:
    inputs:
      from:
        description: First day to send, YYYY-MM-DD
        required: true
      to:
        description: Last day to send, YYYY-MM-DD (empty for today)
        required: false
      timelines-only:
        description: Send only each pull request's timeline, beside the pull requests the Monitor holds
        type: boolean
        default: false

# Two backfills share the API's hourly allowance; one at a time.
concurrency:
  group: cycle-time-backfill
  cancel-in-progress: false

permissions: {}

jobs:
  send:
    name: Send
    # The write key only ever reaches `main`'s own code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HARNESS_WRITE_KEY: ${{ secrets.HARNESS_WRITE_KEY }}
      HARNESS_MONITOR_URL: ${{ vars.HARNESS_MONITOR_URL }}
      # Passed through the environment, never into the script, so an input is only ever data.
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      TIMELINES_ONLY: ${{ inputs.timelines-only }}
    steps:
      - name: Check the key and the address are set
        id: ready
        run: |
          if [ -z "$HARNESS_WRITE_KEY" ] || [ -z "$HARNESS_MONITOR_URL" ]; then
            echo "::notice title=Nothing sent::Set the secret HARNESS_WRITE_KEY and the variable HARNESS_MONITOR_URL first (docs/deployment.md, \"The Harness Monitor\")."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      # Node only, no install: the tool reads the API with the standard library.
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version-file: package.json
      - name: Send the window
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -- --send --from "$FROM"
          if [ -n "$TO" ]; then set -- "$@" --to "$TO"; fi
          if [ "$TIMELINES_ONLY" = "true" ]; then set -- "$@" --timelines-only; fi
          node tools/cycle-time/src/cli.js "$@"
