name: Claude Security Review

# A security pass over the diff, scoped to the rules this project decided on
# rather than to generic advice. The rules themselves are in
# .github/security-review-instructions.md, as a file rather than a string in
# here, because they are prose that will grow and prose inside a YAML scalar
# inside a shell quote is three layers of escaping.
#
# This is the judgement half. CodeQL (codeql.yml) is the mechanical half and
# runs on the same pull requests; the instructions file says explicitly not to
# spend this run re-deriving what CodeQL already reports.
#
# `pull_request`, never `pull_request_target`. That trigger runs the base
# branch's workflow with repository secrets in scope while checking out code the
# pull request author controls - on a public repository that allows forking,
# that hands CLAUDE_CODE_OAUTH_TOKEN to anyone who opens a pull request.
# Rotating the token afterwards closes the window; it does not undo anything
# done inside it, and it is the same token the review and @claude workflows run
# on. The same goes for `workflow_run` and for any other arrangement that puts
# fork-authored code and repository secrets in one job. If fork pull requests
# ever become inconvenient, this is why the convenient fix is not already here.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # One review per pull request at a time. Superseded runs are cancelled: the
  # verdict that matters is the one for the current head, and paying for a
  # review of a commit nobody will merge buys nothing.
  group: security-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    name: Security review
    # Two skips, for different reasons.
    #
    # A fork's pull request gets a read-only token and no secrets, so this job
    # cannot run - and left to fail it would report red for a reason that has
    # nothing to do with the change, which is how a check stops being read.
    # Skipping says so instead.
    #
    # A draft is work in progress, and reviewing every intermediate push of one
    # costs a full run each time to tell someone something they already know
    # they have not finished. Marking it ready for review is in the trigger
    # types above, so a draft is reviewed the moment it stops being one.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review posts its findings as inline comments.
      pull-requests: write
      issues: read
      # Carried from claude-code-review.yml rather than established here.
      # Nothing in this repository has shown that claude-code-action needs it
      # when it authenticates with an OAuth token rather than through OIDC, and
      # an unexplained write permission on a job that reads pull request content
      # is the kind of thing this repository's own security instructions tell a
      # reviewer to flag. Worth removing and watching a run, once this workflow
      # is on the default branch and can actually run - which it cannot on the
      # pull request that adds it.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review reads the instructions file out of the checkout, and
          # compares against history when a rule's origin matters.
          #
          # Also load-bearing for the step below: only at depth 0 does checkout
          # fetch `+refs/heads/*:refs/remotes/origin/*`, and without those
          # remote-tracking branches there is no `origin/<base>` to point
          # `origin/HEAD` at. At any other depth it fetches the pull request's
          # merge ref alone, and `set-head` fails with "Not a valid ref" - red,
          # which is the right way round: the alternative is a checkout that
          # silently reviews nothing again.
          fetch-depth: 0

      # Without this the review never runs at all, and says nothing about why.
      #
      # /security-review's own prompt template embeds a shell command,
      # `git log --no-decorate origin/HEAD...`, which is expanded before the
      # prompt reaches the model. actions/checkout fetches every remote branch
      # but never writes the origin/HEAD symbolic ref, so that command fails,
      # the expansion fails with it, and the session ends having taken zero
      # turns - while the action still reports conclusion=success. Every run
      # between this workflow merging and this step being added failed that way.
      #
      # set-head writes a local symbolic ref and makes no network call, so this
      # costs nothing. --auto would ask the remote which branch is default and
      # need one; the branch is already in the event payload.
      #
      # The pull request's own base, not the repository's default branch. They
      # are the same value for as long as every pull request targets `main`, and
      # they are the same value today - but the day one targets something else,
      # the default branch would have the review read the diff against the wrong
      # base and say nothing about it. That is the one failure the instructions
      # file says nothing downstream can catch: a review that quietly covers the
      # wrong thing still ends with a verdict, and the gate cannot tell.
      #
      # It stays in `env:` rather than being interpolated into the script, and
      # that matters more here than it did for the default branch: this is a
      # branch name someone chose, and this repository's own security
      # instructions call interpolating one into a `run:` block a finding.
      #
      # The echo is what makes the next run legible. This step failing is loud,
      # but this step succeeding against a ref nobody can see is how the same
      # class of silence comes back; printing what it resolved means the run log
      # answers "was the diff scoped correctly" without anyone re-deriving it.
      - name: Point origin/HEAD at the branch under review
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git remote set-head origin "$BASE_REF"
          echo "origin/HEAD -> $(git symbolic-ref --short refs/remotes/origin/HEAD)"

      - name: Run the security review
        id: security-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # An explicit name rather than '*': this repository is public, and '*'
          # would let any GitHub App trigger this workflow with a prompt it
          # controls.
          allowed_bots: 'claude[bot]'
          prompt: |
            /security-review

            Review the diff of pull request ${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read .github/security-review-instructions.md first and treat it as the definition of what
            counts as a finding in this repository. Post each finding as an inline comment on the line
            it concerns. Do not post a summary comment: the gate writes one from your verdict after
            you finish, and a second would just be a duplicate of it.
          # Worth being explicit that the instructions are read from the branch
          # under review rather than from the default branch, which means a
          # pull request can weaken the rules it is about to be judged by. That
          # is deliberate - it is the only way a change to the rules can be
          # tried before it merges - and it is safe for the reason the fork
          # guard above is not needed twice: only someone who can already push
          # here can do it, and the edit appears in the diff, where the code
          # review and a human both see it. It would stop being safe the day
          # this workflow runs on code from someone without push access.
          claude_args: >-
            --allowedTools "Skill,Task,Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a single non-interactive run. Nothing will wake you once you stop, so a background task you are waiting on will never report back and the review will end having done nothing. Launch every subagent in the foreground and wait for its result before continuing. Never launch a background task, and never end your turn to wait for a completion notification. Two further rules govern this run. FIRST: you must end your final message with a single line of the exact form 'SECURITY-VERDICT: X' where X is one of NONE, LOW, MEDIUM or HIGH, naming the highest severity you found, and NONE when you found nothing. Write that line exactly once - do not restate the format anywhere else in your output, because a second line of that form is indistinguishable from a second verdict and fails the check. A run that ends without this line is treated as one that never reached a verdict, and its check goes red. SECOND: having reviewed this pull request before is not a reason to stop. Commits pushed since you last spoke have not been reviewed by anyone, and they are exactly where a fix for an earlier finding introduces a new problem. Review the current head every time and give your verdict for it."
          # Without this the action hides tool output, so a blocked review is
          # indistinguishable from a clean one.
          show_full_output: true

      - name: Assert the review reached a verdict
        if: always()
        env:
          CONCLUSION: ${{ steps.security-review.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.security-review.outputs.execution_file }}
          # The gate leaves the verdict on the pull request itself, because the
          # reviewer does not reliably do it. The prompt asks it to - "post a
          # short summary comment when you find nothing" - and on the first run
          # that ever reached a verdict it posted nothing at all, leaving a green
          # check whose only evidence was inside the job log. That is the state
          # this gate exists to refuse: from the pull request alone, "reviewed,
          # found nothing" read exactly like "never ran".
          #
          # Asking harder was the obvious fix and the wrong one. The sibling
          # workflow already infers a review from whether Claude spoke, and issue
          # 75 is the open bug saying that inference goes stale. The gate knows
          # the verdict; having it say so needs nobody's cooperation.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Every decision this makes is in scripts/lib/review-gate.mjs, asserted
        # by node --test in the Scripts job. The equivalent step in
        # claude-code-review.yml is ~120 lines of bash whose comments record
        # four occasions when a blocked or declining session reported green -
        # all four bugs in a parser that nothing could run.
        run: node scripts/assert-security-review.mjs "$EXECUTION_FILE" "$CONCLUSION"
