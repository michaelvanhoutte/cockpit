# Throwaway: builds the Panel widget POC's APK. Deleted with the poc/panel-widget branch.
name: Panel widget POC

on:
  push:
    branches: [poc/panel-widget]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc/panel-widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: panel-widget-poc
          path: poc/panel-widget/app/build/outputs/apk/debug/app-debug.apk
