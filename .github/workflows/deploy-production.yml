name: Deploy production

# `main` is production. It only ever receives a reviewed merge commit from `dev`
# (or a hotfix), so by the time a commit lands here it has already been through
# a preview and a staging soak. Deploying automatically is therefore the safe
# option rather than the reckless one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cockpit.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Re-run the gate here rather than trusting the run on `dev`. The merge
      # commit into `main` is a tree that has never been tested as such, even
      # when both parents were green.
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Migrate production database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # D1 keeps 30 days of point-in-time recovery ("time travel"), which is
          # the rollback of last resort if a migration goes wrong. See
          # docs/deployment.md §5 for the restore procedure.
          # --env="" explicitly targets the top-level environment. Wrangler
          # warns on a bare command once any [env.*] exists, precisely to stop
          # someone deploying production by accident.
          command: d1 migrations apply cockpit --remote --env=""

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env=""

      - name: Verify health
        run: |
          url="https://cockpit.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/health"
          # Production is not Access-gated, so /health must genuinely answer 200
          # with {"ok":true}: the endpoint checks D1 connectivity (§9.2).
          body=$(curl -sS --max-time 20 --retry 3 --retry-delay 5 "$url")
          echo "GET /health -> $body"
          echo "$body" | grep -q '"ok":true' || { echo "health check failed"; exit 1; }
