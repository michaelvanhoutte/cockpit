name: Deploy preview

# Every branch except the trunk gets its own clickable environment. Deliberately
# triggered on `push` rather than `pull_request`, so a branch with no PR, or a
# draft PR, is deployed too.
on:
  push:
    branches-ignore:
      - main

concurrency:
  # One preview deploy per branch at a time; superseded pushes are cancelled.
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    # Needed to write the deployment URL into the PR, when there is a PR.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Gate first: a broken build should not replace a working preview.
      - run: pnpm typecheck
      - run: pnpm test

      - name: Derive preview alias
        id: alias
        run: echo "alias=$(bash scripts/branch-alias.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: pnpm --filter @cockpit/web build

      # Migrations run before the version is uploaded, so the new code never
      # meets the old schema. All previews share one database, so a migration
      # here is visible to every other open branch's preview: see the recorded
      # trade in docs/deployment.md §4.
      - name: Migrate preview database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply cockpit-preview --remote --env preview

      - name: Seed preview database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # seed.sql is INSERT OR IGNORE throughout, so re-running it on the
          # shared database is safe and idempotent.
          command: d1 execute cockpit-preview --remote --yes --file=./seed.sql

      # `versions upload` (not `deploy`): this uploads a new version of the
      # cockpit-preview Worker and routes an aliased preview URL to it, without
      # touching that Worker's active deployment. --env preview is what binds
      # the preview D1 rather than production's; omitting it would silently
      # point this branch at the production database.
      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: versions upload --env preview --preview-alias ${{ steps.alias.outputs.alias }}

      - name: Summarise
        env:
          URL: https://${{ steps.alias.outputs.alias }}-cockpit-preview.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
        run: |
          {
            echo "### Preview deployed"
            echo
            echo "**Branch:** \`$GITHUB_REF_NAME\`"
            echo "**URL:** $URL"
            echo
            echo "Gated by Cloudflare Access. Shares the \`cockpit-preview\` database with all other open branches."
          } >> "$GITHUB_STEP_SUMMARY"

      # Best-effort convenience: only fires when the branch actually has an
      # open PR. A branch without one still gets its URL in the run summary.
      - name: Comment the preview URL on the PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: https://${{ steps.alias.outputs.alias }}-cockpit-preview.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
        # Identified by a marker rather than by `gh pr comment --edit-last`,
        # which matches the most recent comment by the current author and
        # nothing else. That was unambiguous while this was the only workflow
        # commenting as github-actions[bot]; the security review's gate now
        # posts its verdict under the same identity, so whichever of the two
        # spoke last would have become the other's next edit target - a preview
        # URL overwriting a verdict, or a fresh verdict posted and overwritten
        # again on the next push. Both workflows now look for their own marker
        # and ignore each other's.
        run: |
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            PR_NUMBER="$pr" node scripts/sticky-comment.mjs \
              '<!-- cockpit-preview-url -->' \
              "Preview: $URL (Access-gated, shared preview database)"
          fi
