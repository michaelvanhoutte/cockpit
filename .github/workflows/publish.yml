name: Publish

# GitHub Pages, called from ci.yml after a merge and from nightly.yml after its
# own run. The site is the architecture page at /architecture/ and a redirect at
# each address a harness report used to have, sent to that report's Harness
# Monitor page. The reports themselves (cycle time, test selection, tests, CI
# stability) are drawn by the Monitor from the rows CI sends it (docs/deployment.md,
# "The Harness Monitor").
#
# The architecture page is fetched as the newest artifact from an eligible run of
# nightly.yml on `main`, never the newest *successful* run, so a night where
# another job failed still puts the page live. A missing artifact costs that page
# and never the redirects.
on:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # download-artifact and the `gh api` call below read across runs through
      # the Actions API, which the workflow-level block above withholds by default.
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A local composite action (`./.github/actions/find-artifact`, below)
      # only resolves once the tree it lives in is on the runner — nothing
      # here otherwise touches the checkout, since the page is read through
      # the API rather than the tree.
      - uses: actions/checkout@v4

      # Trusts only a run of nightly.yml, on `main`, started by a schedule or a
      # person with write access dispatching one by hand — never a pull request
      # from a fork branched `main`, which could otherwise upload an artifact of
      # any name whose `head_branch` reads `main` and have this job publish it
      # on the site's own origin. Continue-on-error, so a transient failure
      # still lets the redirects out.
      - name: List nightly.yml's eligible runs on main
        id: nightly-runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?branch=main&per_page=50" |
            jq -c '[.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .head_repository.full_name == env.GITHUB_REPOSITORY) | .id]')
          echo "runs=$runs" >> "$GITHUB_OUTPUT"

      - name: Find the architecture page
        id: architecture
        continue-on-error: true
        uses: ./.github/actions/find-artifact
        with:
          name: architecture-report
          runs: ${{ steps.nightly-runs.outputs.runs }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Take the architecture page, if there is one
        if: ${{ steps.architecture.outputs.run-id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: architecture-report
          path: site/architecture/
          run-id: ${{ steps.architecture.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Every publish rebuilds the site, so the redirects are written on every
      # publish. Each keeps the query and the hash it was opened with. A JSON file
      # cannot redirect, so an old `model.json` address is a 404: its readers read
      # the Monitor's page with `?format=json` instead (docs/deployment.md,
      # "Publishing"). Without the repository variable the pages cannot point
      # anywhere, so none is written and the run says so.
      - name: Send each old report address to its Harness Monitor page
        env:
          HARNESS_MONITOR_URL: ${{ vars.HARNESS_MONITOR_URL }}
        run: |
          monitor="${HARNESS_MONITOR_URL%/}"
          if ! printf '%s' "$monitor" | grep -Eq '^https://[^[:space:]"'"'"'<>\\]+$'; then
            echo "::warning title=Old report addresses not redirected::The repository variable HARNESS_MONITOR_URL is not set to an https address, so the old report addresses were not written. See docs/deployment.md, \"The Harness Monitor\"."
            exit 0
          fi
          redirect() {
            file="site/$1"
            target="$monitor/$2"
            mkdir -p "$(dirname "$file")"
            cat > "$file" <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>Moved to the Harness Monitor</title>
          <meta http-equiv="refresh" content="0; url=$target">
          <link rel="canonical" href="$target">
          <script>location.replace('$target' + location.search + location.hash);</script>
          <p>This report moved to the <a href="$target">Harness Monitor</a>.</p>
          EOF
          }
          redirect index.html tests
          redirect cycle-time/index.html cycle-time
          redirect selection/index.html selection
          redirect stability/index.html stability
          redirect lead-time/index.html cycle-time

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v4
