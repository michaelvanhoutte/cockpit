name: Contract

# The tier that talks to the real third parties - Claude, the Workers AI model
# that reads what a note means, and the Bot Framework's published signing keys
# (docs/testing-strategy.md, "Third parties"):
# everything below it runs against a fake, and this is what says the fake still
# resembles the thing. The whole tier runs when the half of the contract we own
# changes, which is a prompt, and by hand from the Actions tab. The Claude
# suites never run on the schedule, because every run spends real money; the
# weekly run takes only the suites that cost next to nothing - Teams' signing
# keys, Gmail and the meaning model - so a change on their side still shows
# within a week.
#
# Not a required check: while it can fail for a reason the change did not cause
# ("Make the nightly contract run pass again", issue 705), it reports drift on the pull request without blocking a merge.
on:
  pull_request:
    paths:
      - 'apps/api/src/ai/**'
      - 'apps/api/tests/contract/**'
      - 'packages/connectors/gmail/tests/contract/**'
      - 'apps/api/vitest.contract.config.ts'
      - '.github/workflows/contract.yml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The connector's own contract suite: what Microsoft publishes for
      # checking a saved Teams message, asked of Microsoft ("Save a Teams
      # message to Cockpit", issue 486). No secret - the Bot Framework's
      # signing keys are published to anyone - and first, because a failure
      # here costs nothing and a failure below costs the model's time.
      - run: pnpm --filter @cockpit/connector-teams test:contract
      # Gmail's own, in its connector package ("Build Gmail as a connector
      # package on the SDK, unregistered", issue 943): the same dedicated test
      # mailbox the API's suite below uses, and a skip, not a failure, without
      # it. Free, so it runs weekly too. The API's copy goes with Gmail's code
      # when it leaves the core (issue 944).
      - run: pnpm --filter @cockpit/connector-gmail test:contract
        env:
          GMAIL_CONTRACT_CLIENT_ID: ${{ secrets.GMAIL_CONTRACT_CLIENT_ID }}
          GMAIL_CONTRACT_CLIENT_SECRET: ${{ secrets.GMAIL_CONTRACT_CLIENT_SECRET }}
          GMAIL_CONTRACT_REFRESH_TOKEN: ${{ secrets.GMAIL_CONTRACT_REFRESH_TOKEN }}
      # A missing secret presents as a workflow that goes green having done
      # nothing, which is the failure docs/deployment.md records for
      # `CLAUDE_CODE_OAUTH_TOKEN`. Each suite itself refuses to run without its
      # own credential (tests/contract/), so this only names the secrets; it
      # does not print them. The Cloudflare pair is the same pair the deploy
      # workflows already use, and is what reads what a note means - which needs
      # Workers AI: Read on that token beside the scopes a deploy needs
      # (docs/deployment.md, "Bootstrap runbook").
      #
      # The weekly run names the two free suites and withholds the Claude key,
      # so it cannot spend on the model even if a Claude suite were selected.
      - run: pnpm --filter @cockpit/api test:contract ${{ github.event_name == 'schedule' && 'gmail read-what-a-note-means' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'schedule' && secrets.ANTHROPIC_API_KEY || '' }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A dedicated test mailbox for what Gmail answers ("Bring in the
          # conversations already labelled Cockpit as tasks", issue 725). Unlike
          # the model suites, Gmail's skips without these rather than failing:
          # until somebody provisions the mailbox, a skip is the honest answer
          # (docs/deployment.md, "A Google Cloud project for Gmail").
          GMAIL_CONTRACT_CLIENT_ID: ${{ secrets.GMAIL_CONTRACT_CLIENT_ID }}
          GMAIL_CONTRACT_CLIENT_SECRET: ${{ secrets.GMAIL_CONTRACT_CLIENT_SECRET }}
          GMAIL_CONTRACT_REFRESH_TOKEN: ${{ secrets.GMAIL_CONTRACT_REFRESH_TOKEN }}
