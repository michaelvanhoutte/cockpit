name: CodeQL

# Static analysis on the same two events as ci.yml, for the same reason: the
# merge commit on main is a tree that has never been analysed as such.
#
# Deliberately no path filters, on this workflow or on claude-code-review.yml.
# A required status check whose *workflow* never triggers does not report green -
# it does not report at all, and the pull request waits on it forever. At the
# trigger level, "skip the analysis on documentation-only changes" and "block
# every documentation-only pull request" are the same setting.
#
# **And no job-level `if:` either**, though "Skip the mechanical checks on a
# pull request that touches nothing they cover" (issue 345) asked for one and
# ci.yml's five mechanical jobs took it. Two of this workflow's three required
# contexts are jobs and would skip safely; the third, `CodeQL`, is posted by
# GitHub Advanced Security when an analysis uploads its results, and whether it
# is posted at all when none does is not something this repository has measured.
# A required context nothing reports under waits forever, so the wrong guess
# blocks every documentation-only pull request permanently - the exact failure
# the paragraph above exists to avoid, arrived at by another route. The two legs
# cost 0.6-3.3 minutes against a `claude-review` on the same pull request that
# takes 9-15, so skipping them would shorten nothing anybody waits for.
# deployment.md's "Bootstrap runbook" carries the measurement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codeql-${{ github.ref }}
  # Cancel superseded pull request runs, never superseded runs on main.
  #
  # On a pull request this is free: branch protection evaluates its required
  # checks against the head commit, so an analysis cancelled on a commit that is
  # no longer the head cannot hold the merge, and paying for it twice buys
  # nothing.
  #
  # On main it is not free. The default branch's analysis is the baseline every
  # pull request's alerts are compared against, so cancelling one leaves the
  # baseline standing at an older commit - and two merges landing close together
  # is exactly when that happens.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # This name is what branch protection matches on, once per matrix leg:
    # "CodeQL (javascript-typescript)" and "CodeQL (actions)", both verified
    # against a real run rather than predicted. Renaming either the job or the
    # matrix values silently stops the required check reporting, and a required
    # check that never reports blocks every pull request. See the ordering note
    # in deployment.md's "Bootstrap runbook".
    #
    # These two say the analysis ran. They do not say it was clean: the check
    # that fails on a high-severity alert is a third one, named "CodeQL" and
    # posted by GitHub Advanced Security rather than by this workflow, and it is
    # required alongside them for exactly that reason.
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Writing the analysis results back is the entire point of the job.
      security-events: write
      # Declaring any permissions block sets every scope not listed to `none`,
      # so this line is not the no-op it looks like. GitHub's own CodeQL
      # template carries it, documented as needed for workflows in private
      # repositories - which this one is not, and the cost of finding that out
      # the hard way is two failing legs whose error names neither this block
      # nor the visibility change that caused it.
      actions: read

    # A pull request from a fork gets a read-only token whatever this block
    # says, and all three CodeQL checks have been required on `main` since
    # 2026-09-09 - so a fork that could not upload its results would be shut out
    # of contributing entirely. It can upload; deployment.md's "Bootstrap
    # runbook" carries the evidence, how strong it is, and the escape hatch if
    # it ever stops being true.

    strategy:
      # One leg's failure must not cancel the other's: an infrastructure failure
      # analysing the workflows says nothing about the sources, and burying the
      # sources' result would make a partial run look like a whole one.
      fail-fast: false
      matrix:
        include:
          # The application itself. build-mode "none" is right for an
          # interpreted language: CodeQL reads the sources directly, so there is
          # no build to drive and no toolchain to install - which is also why
          # this job does not use .github/actions/setup.
          - language: javascript-typescript
            build-mode: none
          # The workflows themselves, which is where this repository's own risk
          # is concentrated: they run Claude against an OAuth token and they
          # check out pull request branches. The queries here are the ones that
          # find an untrusted value interpolated into a run block, and a
          # permission granted wider than the job needs.
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # No assertion step, unlike claude-code-review.yml. That gate exists
      # because a Claude session can decline to review and still exit zero; this
      # action fails the job when the analysis fails, so a broken run is already
      # red rather than a green tick over nothing.
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
