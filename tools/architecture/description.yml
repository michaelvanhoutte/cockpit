# What the architecture report cannot read from the code: each area's wording,
# where it sits on the Modules view, who the Context view shows, and the rules
# the marks come from. tools/architecture/README.md says how it is read.

# Where to look for areas. `one` is a folder drawn as a single area; `folders`
# is each folder inside it (and, with rootFiles, the files directly in it as
# one more); `packages` is each folder inside it that holds a package.json.
# `role` is the role of an area this file does not describe yet.
discover:
  - { path: apps/web/src, as: one, role: core }
  - { path: apps/api/src, as: folders, rootFiles: true, role: core }
  - { path: packages, as: packages, role: core }
  - { path: packages/connectors, as: packages, role: connector }

# What counts as source code, what is a test (never read, and a folder of
# nothing else is not an area) and which folders hold nothing of ours.
scan:
  extensions: ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs']
  tests: '(^|/)(tests?|__tests__|__mocks__)/|\.(test|spec)\.[cm]?[jt]sx?$'
  ignore: [node_modules, dist, build, coverage, out, .wrangler, .turbo]

# Names of a source of items, each drawn as a connector box on Modules. `words`
# are whole words in any case; the words of a phrase may be joined by a space,
# - or _, or a change of case. A core file whose file name carries one is that
# connector's code living in the core. `package` is the connector's own package;
# a source without one is drawn dashed red, with no package.
sources:
  - { id: gmail, name: Gmail, words: [gmail], package: packages/connectors/gmail }
  - { id: claude-code, name: Claude Code, words: [claude code] }
  - { id: teams, name: Microsoft Teams, words: [teams], package: packages/connectors/teams }
  - { id: outlook, name: Outlook, words: [outlook], package: packages/connectors/outlook }
  - { id: twilio, name: Text messages, words: [twilio], package: packages/connectors/twilio }

# Parts shipped on their own, outside the Worker's release: each is drawn as a
# box beside the Worker's outline. `path` is the folder that holds it.
releasedOnItsOwn:
  - { name: Teams app, path: packages/connectors/teams/teams-app, description: 'Its manifest, zipped and uploaded to Teams by hand.' }

# Files the connector count skips. The composition root is the one core file that
# may name connectors: the application knows them only as the list in this file
# (docs/architecture.md, "Connectors: plugin-shaped, host-blind").
exemptFromSources:
  - apps/api/src/connectors/registry.ts
  - apps/api/src/engines/list.ts
  - apps/web/src/components/engines.ts

# A connector package may import its SDK and nothing else of ours: not the
# shared contract, not the app. `scope` is the prefix of our own packages.
connectorRule:
  sdk: '@cockpit/connector-sdk'
  scope: '@cockpit/'

# Areas every other area reads, so their cells on the Dependencies view are
# muted rather than marked: env.ts holds the bindings type every API area takes.
# Each is an area's path, as the layers below give it.
readByEveryone:
  - apps/api/src/*

context:
  cockpit:
    name: Cockpit
    summary: Unified inbox and dashboards, one Worker per environment on Cloudflare serving the API, live updates and the app.
    runs: production · staging
  people:
    - { name: People in a workspace, detail: 'browser, installed PWA, share sheet' }
    - { name: Guest, detail: 'demo sign-in, reset every night' }
    - { name: Admin and operator, detail: 'admin pages, backup and restore' }
    - { name: AI agents, detail: 'Claude.ai, Claude Code over MCP' }
  services:
    - { name: Google, detail: 'sign-in, Gmail API' }
    - { name: Microsoft, detail: 'Entra sign-in, Teams via Bot Framework, Outlook mail via Graph' }
    - { name: Twilio, detail: 'Verify texts a code to a phone being connected' }
    - { name: Anthropic, detail: 'Claude API reads captured notes' }
    - { name: Cloudflare Workers AI, detail: 'embeddings, notes that repeat; Whisper, dictation' }
    - { name: GitHub, detail: 'code, CI, deploys, report pages' }

# Pins for the Dependencies view, which orders its areas by who imports whom.
# `above` stands above `below` wherever the computed order puts them the other
# way; an import then pointing up shows red. Each is an area's path, as the
# layers below give it; none is needed today.
pins: []

# The layers, top to bottom, and the areas in each in order, as the Modules view
# draws them; the order also settles a tie in the Dependencies view. An area's
# `name` labels it there and defaults to its path.
layers:
  - title: Web app
    note: Served by the Worker as static assets; it talks to the API over HTTP and live updates, in the shapes of packages/shared.
    role: core
    areas:
      - path: apps/web/src
        name: 'web'
        description: 'The React app: router, pages, panels, Inbox, Capture and its offline outbox, item form, settings and connections.'

  - title: API
    note: One Cloudflare Worker. worker.ts dispatches fetch, queue and scheduled; the Hono app handles requests.
    role: core
    areas:
      - path: apps/api/src/http
        name: 'http'
        description: 'The Hono app: every route, request validation, error-to-status mapping and the live-update stream.'
      - path: apps/api/src/auth
        name: 'auth'
        description: 'Sign-in with OIDC, sessions, the gate in front of every route, operator and admin access, attachment links.'
      - path: apps/api/src/mcp
        name: 'mcp'
        description: 'The MCP server at /mcp: OAuth for connected apps, consent, grants and the create_item tool.'
      - path: apps/api/src/jobs
        name: 'jobs'
        description: 'The queue consumer that cleans up and reads captured notes, and the nightly scheduled work.'
      - path: apps/api/src/engines
        name: 'engines'
        description: 'Claude Code, the one outbound engine: the trigger check, the fire request, its refusal wording and reading a hook, reached only through engines/list.ts.'
      - path: apps/api/src/ai
        name: 'ai'
        description: 'The Claude layer behind a project-owned interface: prompts that clean up a note and choose a panel.'
      - path: apps/api/src/embeddings
        name: 'embeddings'
        description: 'Reads what a note means with Workers AI, so a note that repeats another can be flagged.'
      - path: apps/api/src/transcription
        name: 'transcription'
        description: 'Turns a dictated recording into its words with Whisper on Workers AI, held in memory for the call.'
      - path: apps/api/src/gateway
        name: 'gateway'
        description: 'Makes and retries every paid provider call, and records each attempt in D1 for 12 months.'
      - path: apps/api/src/accounts
        name: 'accounts'
        description: 'The AccountStore Durable Object, one per account: its SQLite schema, change log, command service, backup and restore.'
      - path: apps/api/src/domain
        name: 'domain'
        description: 'The account data model as plain code: items, panels, dashboards, filings, workspaces and the histories behind them.'
      - path: apps/api/src/db
        name: 'db'
        description: 'The register in D1 (accounts, users, sign-ins, connector directory): its Drizzle schema and client.'
      - path: apps/api/src/connectors
        name: 'connectors'
        description: 'The composition root where the core meets connectors, with the host connectors run against and the credential crypto.'
      - path: apps/api/src/email
        name: 'email'
        description: 'Email to Cockpit: the register of addresses and the email event that rejects mail to an address nobody holds.'
      - path: apps/api/src/*
        name: 'env.ts, worker.ts'
        description: 'The Worker entry points (worker.ts, index.ts), its bindings type (env.ts) and the share target.'

  - title: Packages
    note: Shared by the web app and the API.
    role: core
    areas:
      - path: packages/shared
        name: 'shared'
        description: 'The contract between web and API: domain types, Zod schemas, command definitions and API shapes.'
      - path: packages/connector-sdk
        name: 'connector-sdk'
        description: 'The connector SPI: what a connector is and the only capabilities the host offers it.'
      - path: packages/config
        name: 'config'
        role: other
        description: 'Shared tsconfig and formatting config for the monorepo; no code runs from it.'

  - title: Connector packages
    note: A connector imports the connector SDK and nothing else of ours.
    role: connector
    areas:
      - path: packages/connectors/teams
        name: 'connectors/teams'
        description: 'The Microsoft Teams connector: a Save to Cockpit message action, verified as a genuine Bot Framework call.'
      - path: packages/connectors/gmail
        name: 'connectors/gmail'
        description: 'The Gmail connector: conversations labelled Cockpit, or starred, arrive as Tasks, and their label or star follows the Task.'
      - path: packages/connectors/outlook
        name: 'connectors/outlook'
        description: 'The Outlook connector: messages flagged, or categorised Cockpit, in a Microsoft 365 mailbox arrive as Tasks.'
      - path: packages/connectors/twilio
        name: 'connectors/twilio'
        description: 'The Twilio connector: a phone is connected by confirming a code Twilio Verify texts to it.'

# The design: the layers Cockpit is meant to have, drawn on the Logical page with the code's own lines laid
# over them. A component is made of `folders` (area paths, as the layers above give them), and every folder
# the code has is in exactly one component or in `noLine`, which the architecture tool's test checks.
# A store or outside service has a `marker`, a regular expression the code is searched for: a line of code
# (never a comment) that matches means the file reaches it, and `how` says in what words.
design:
  # Rows run top to bottom by `row`; two layers on one row share it by `share`. `alignedWith` draws a layer
  # as a column beside the row of another. `drawInside` draws the lines inside that layer, which are otherwise
  # only counted on its title. Each `items` entry is one row of chips.
  layers:
    - id: clients
      title: Clients
      kind: clients
      row: 0
      items:
        - - { id: web, name: Web app, sub: 'React PWA, in the browser', folders: [apps/web/src] }
          - { id: widget, name: Android widget, sub: on the home screen, kind: client }
          - { id: agents, name: MCP clients, sub: 'Claude.ai, Claude Code', kind: client }
          - { id: msteams, name: Microsoft Teams, sub: a message action, kind: client }
          - { id: mail, name: Mail senders, sub: Email Routing, kind: client }
          - { id: monitor, name: Harness Monitor, sub: a service of its own, kind: client }
          - { id: staging, name: 'Staging, CI', sub: Claude call records, kind: client }

    - id: api
      title: "API layer: the Worker's entry points"
      row: 1
      items:
        - - { id: http, name: Application API, sub: 'REST /v1, live updates', folders: [apps/api/src/http] }
          - { id: auth, name: 'Sign-in & gate', sub: 'sessions, the gate', folders: [apps/api/src/auth] }
          - { id: mcp, name: 'OAuth, MCP, apps API', sub: '/oauth, /mcp, /apps/v1', folders: [apps/api/src/mcp] }
          - { id: email, name: Email in, sub: the email handler, folders: [apps/api/src/email] }
          - { id: jobs, name: Jobs, sub: 'queue consumer, cron', folders: [apps/api/src/jobs] }

    - id: logic
      title: Business logic
      row: 2
      items:
        - - { id: accounts, name: Accounts, sub: a Durable Object each, folders: [apps/api/src/accounts] }
          - { id: domain, name: Domain, sub: 'items, panels, filings', folders: [apps/api/src/domain] }
          - { id: connectors, name: Connector host, sub: names the connectors, folders: [apps/api/src/connectors] }
          - { id: ai, name: AI, sub: 'notes, embeddings, dictation', folders: [apps/api/src/ai, apps/api/src/embeddings, apps/api/src/transcription] }
          - { id: gateway, name: Provider gateway, sub: every paid call, folders: [apps/api/src/gateway] }
          - { id: engines, name: Engines, sub: the Claude Code trigger, folders: [apps/api/src/engines] }

    - id: data
      title: Data
      row: 3
      share: 0.6
      items:
        - - { id: d1, name: Register, sub: 'D1, all accounts', kind: store, folders: [apps/api/src/db], marker: '\benv\??\.DB\b', how: SQL }
          - { id: do, name: Account store, sub: SQLite per account, kind: store, marker: '\b(ctx|this\.ctx|state)\.storage\.sql\b|storage\.sql\b', how: SQL }
          - { id: r2, name: Attachments, sub: R2 bucket, kind: store, marker: '\benv\??\.ATTACHMENTS\b', how: objects }
          - { id: kv, name: OAuth grants, sub: KV, kind: store, marker: '\bOAUTH_KV\b', how: keys }
          - { id: queue, name: Queue, sub: ENRICHMENT, kind: store, marker: '\benv\??\.ENRICHMENT\b', how: enqueue }

    - id: conn
      title: Connectors
      row: 3
      share: 0.4
      drawInside: true
      items:
        - - { id: sdk, name: connector-sdk, sub: what a connector is, folders: [packages/connector-sdk] }
        - - { id: gmail, name: gmail, sub: implements it, folders: [packages/connectors/gmail] }
          - { id: outlook, name: outlook, sub: implements it, folders: [packages/connectors/outlook] }
          - { id: teams, name: teams, sub: implements it, folders: [packages/connectors/teams] }
          - { id: twilio, name: twilio, sub: implements it, folders: [packages/connectors/twilio] }

    - id: outside
      title: Outside services
      kind: outside
      alignedWith: logic
      items:
        - - { id: google, name: Google, sub: 'sign-in, Gmail API', kind: outside, marker: 'accounts\.google\.com|googleapis\.com', how: HTTPS }
          - { id: microsoft, name: Microsoft, sub: 'Entra, Graph, Bot', kind: outside, marker: 'login\.microsoftonline\.com|graph\.microsoft\.com|botframework\.com', how: HTTPS }
          - { id: twilio-x, name: Twilio, sub: Verify, kind: outside, marker: 'verify\.twilio\.com', how: HTTPS }
          - { id: anthropic, name: Anthropic, sub: Claude API, kind: outside, marker: '@anthropic-ai/sdk|api\.anthropic\.com', how: Claude API }
          - { id: workersai, name: Workers AI, sub: 'embeddings, Whisper', kind: outside, marker: '\benv\??\.AI\b', how: AI binding }

  # Which layer may call which. A line inside one layer is always allowed.
  mayCall:
    clients: [api]
    api: [logic]
    logic: [data, conn, outside]
    conn: [outside]
    data: [api]

  # What a line the design does not draw breaks, in words, by the pair of layers it joins.
  breaks:
    'api>data': The API layer reaches Data directly, past Business logic
    'api>outside': The API layer calls an outside service directly, past Business logic
    'api>conn': The API layer uses a connector directly, past Business logic
    'logic>api': Business logic depends on the API layer above it
    'conn>logic': A connector depends on Business logic above it
    'conn>api': A connector depends on the API layer above it
    'conn>data': A connector reaches Data directly
    'clients>logic': A client reaches past the API layer

  # Deviations accepted with a reason, changed by pull request. Each names the two components, the files it
  # covers and why: the same line from a file it does not name is red again, and one the code no longer
  # needs is listed as no longer needed.
  accepted:
    - from: auth
      to: d1
      files: [apps/api/src/auth/register.ts, apps/api/src/auth/sign-in-history.ts]
      reason: 'Sign-in reads and writes the Register directly: every question it asks comes before an account is known, so there is nowhere else to ask it.'

  # How callers talk to the service. A request's path is not an import, so each is declared; where this
  # repository holds the caller's code, `code` says where to look for `marker` in it.
  callers:
    - { from: web, to: http, how: 'REST /v1 · SSE · cookie', code: { folder: apps/web/src, marker: '[''`"]/v1/' } }
    - { from: widget, to: mcp, how: 'OAuth · REST /apps/v1', code: { folder: apps/android-widget/app/src/main/java/com/conselit/cockpit/widget, marker: '/apps/v1|/oauth/', extensions: ['.kt'] } }
    - { from: agents, to: mcp, how: 'MCP over HTTP · OAuth' }
    - { from: msteams, to: http, how: Bot Framework webhook }
    - { from: mail, to: email, how: an email event }
    - { from: monitor, to: http, how: GET /v1/usage-records, code: { folder: apps/harness-monitor/src, marker: usage-records } }
    - { from: staging, to: http, how: POST /v1/usage-records, code: { folder: apps/api/src, marker: '\bPRODUCTION\b' } }
    - { from: queue, to: jobs, how: consumed by }

  # Folders in no component: read by nearly everything, so drawn as no line.
  noLine:
    - { folder: packages/shared, name: packages/shared, note: the contract, readByEveryone: true }
    - { folder: apps/api/src/*, name: env.ts, readByEveryone: true }
    - { folder: packages/config, name: packages/config }

# The services beyond Cockpit, each with a design written as `design` above and drawn on a page of its own,
# service-<id>.html. A service that keeps its files in one folder names file-name patterns in it (`in`, `files`;
# `*` is any run of characters in the name) instead of folders: every source file in that folder must be matched by
# exactly one component, and a pattern must match a file, or the architecture tool's test fails. `href` makes a
# store or an outside service open a page of its own.
otherServices:
  - id: harness-monitor
    name: Harness Monitor
    intro: A second Worker with its own D1 database, in apps/harness-monitor.
    design:
      layers:
        - id: clients
          title: Clients
          kind: clients
          row: 0
          items:
            - - { id: hook, name: Claude Code sessions, sub: a Stop hook, kind: client }
              - { id: ci, name: 'CI, nightly jobs', sub: GitHub Actions, kind: client }
              - { id: readers, name: Readers, sub: 'a browser, no sign-in', kind: client }
              - { id: cron, name: Cloudflare cron, sub: 4 schedules, kind: client }

        - id: routes
          title: Routes and write API
          row: 1
          items:
            - - { id: entry, name: Routes and write API, sub: 'every route; POST /v1/* with the write key', in: apps/harness-monitor/src, files: ['worker.*', 'auth.*'] }

        - id: reports
          title: Reports and jobs
          row: 2
          items:
            - - { id: costs, name: Costs and usage, sub: 'GET /, /pr/<n>; the usage store', in: apps/harness-monitor/src, files: ['validate.*', 'store.*', 'costs.*', 'costs-explain.*', 'page.*', 'export.*', 'prices.*', 'price-list.*', 'pull-request.*', 'pull-request-page.*'] }
              - { id: cycle, name: Cycle time, sub: GET /cycle-time, in: apps/harness-monitor/src, files: ['cycle-time*', 'pull-request-strip*', 'pull-request-timeline*'] }
              - { id: selection, name: Test selection, sub: GET /selection, in: apps/harness-monitor/src, files: ['selection*'] }
              - { id: stability, name: CI stability, sub: GET /stability, in: apps/harness-monitor/src, files: ['stability*', 'ci-attempts*', 'ci-flakiness*'] }
              - { id: tests, name: Test coverage, sub: GET /tests, in: apps/harness-monitor/src, files: ['tests*'] }
              - { id: calls, name: "Cockpit's Claude calls", sub: 'GET /claude-calls; the 12-hourly copy', in: apps/harness-monitor/src, files: ['claude-call*'] }
              - { id: linking, name: Linking, sub: 'hourly, from GitHub', in: apps/harness-monitor/src, files: ['linking*', 'github*', 'excluded-files*', 'session-record*'] }
              - { id: jobs, name: Jobs, sub: what each schedule starts, in: apps/harness-monitor/src, files: ['jobs*'] }

        - id: data
          title: Data
          row: 3
          share: 0.5
          items:
            - - { id: mdb, name: harness-monitor, sub: 'D1, its only store', kind: store, href: db-harness-monitor.html, tip: Open its tables, marker: '\.prepare\(|\.batch\(', how: SQL }

        - id: shared
          title: Shared
          row: 3
          share: 0.5
          items:
            - - { id: look, name: Shared look, sub: 'band, tiles, Belgian time', in: apps/harness-monitor/src, files: ['look.*', 'palette.*', 'appearance.*', 'belgium.*', 'explain.*', 'copy-prompt.*', 'report.*'] }

        - id: outside
          title: Outside
          kind: outside
          alignedWith: reports
          items:
            - - { id: github, name: GitHub, sub: REST API, kind: outside, marker: 'api\.github\.com', how: HTTPS }
              - { id: litellm, name: LiteLLM price list, sub: a JSON file on GitHub, kind: outside, marker: 'raw\.githubusercontent\.com', how: HTTPS }
              - { id: cockpit, name: Cockpit, sub: its Application API, kind: outside, href: service-cockpit.html, marker: usage-records, how: HTTPS }

      # Routes hand off to the reports and jobs, which alone read and write the database.
      mayCall:
        clients: [routes]
        routes: [reports, shared]
        reports: [data, outside, shared]

      breaks:
        'routes>data': A route reads or writes the database itself, past the reports
        'routes>outside': A route calls an outside service itself, past the reports
        'reports>routes': A report depends on the routes above it
        'shared>reports': The shared look depends on a report
        'shared>data': The shared look reads the database

      callers:
        - { from: hook, to: entry, how: 'POST /v1/usage · write key' }
        - { from: ci, to: entry, how: 'POST /v1/* results · write key' }
        - { from: readers, to: entry, how: 'GET pages, edge-cached' }
        - { from: cron, to: entry, how: scheduled() }
