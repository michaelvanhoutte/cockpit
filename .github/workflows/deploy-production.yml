name: Promote to production

# Production is a deliberate promotion, never automatic. Staging already runs
# every commit on main; production ships the one you choose.
#
# The `sha` input is what makes "promote exactly what soaked" true rather than
# usually-true: main can move between the soak and the click, so promoting
# "main" would silently ship whatever landed in between.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote, abbreviated or full (blank = current main HEAD)
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cockpit.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
    env:
      # Where each Vitest run leaves the tests that failed in it
      # (scripts/lib/vitest-session-reporter.mjs), absolute because pnpm runs
      # each package from its own folder.
      COCKPIT_FAILED_TESTS_DIR: ${{ github.workspace }}/failed-tests
    steps:
      # Always check out `main` with full history, then move to the requested
      # commit ourselves in the next step.
      #
      # Passing the input straight to `ref:` looks tidier but is broken:
      # actions/checkout resolves `ref` as a branch or tag first, so an
      # abbreviated SHA fails with "A branch or tag with the name '91e5452'
      # could not be found" — and the abbreviated SHA is exactly what GitHub's
      # own commit list offers you to copy. It also means the guard below never
      # gets to run, so a rejected promotion reports the wrong reason.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the commit and refuse to promote one that never soaked
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          target="$INPUT_SHA"
          if [ -z "$target" ]; then
            target='origin/main'
            echo "No sha supplied; promoting current main HEAD."
          fi

          # rev-parse accepts abbreviated SHAs; ^{commit} rejects trees and tags.
          if ! full=$(git rev-parse --verify --quiet "${target}^{commit}"); then
            echo "::error::'$target' is not a commit in this repository. Pass a commit SHA from main (abbreviated is fine), or leave it blank to promote main HEAD."
            exit 1
          fi

          # Everything reachable from main has passed CI and has run on staging,
          # because main auto-deploys there. Anything else has done neither, and
          # this input accepts any commit — including one from a branch that was
          # never merged. Without this check, a stale or mistyped sha puts
          # untested code straight into production.
          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error::$full is not an ancestor of origin/main. It has not passed CI and has not soaked on staging, so it cannot be promoted."
            exit 1
          fi

          git checkout --quiet --detach "$full"
          echo "Promoting $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

      - uses: ./.github/actions/setup

      # Re-run the gate against the exact tree being promoted. CI ran on this
      # commit when it landed on main, but the toolchain and dependencies
      # resolve fresh here, and a promotion may be days later.
      - run: pnpm typecheck
      - run: pnpm test
      # The failed tests by name, for CI stability: a record only where some
      # failed, and it can only add - the job stays what the tests made it.
      - name: Gather the failed tests
        if: ${{ failure() }}
        run: node scripts/ci-failed-tests.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: failed-tests-record
          path: failed-tests-record/record.json
          if-no-files-found: ignore
          # A re-run of a failed job uploads under the first attempt's name, which v4 otherwise refuses.
          overwrite: true
          retention-days: 30
      - run: pnpm build

      - name: Migrate production database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          # --env="" explicitly targets the top-level environment. Wrangler warns
          # on a bare command once any [env.*] exists, precisely to stop someone
          # deploying production by accident.
          #
          # Promoting a commit several ahead of production applies every pending
          # migration in order, which is fine. Promoting an *earlier* commit does
          # NOT un-apply them, which is why migrations must be expand-contract
          # (docs/deployment.md §5).
          command: d1 migrations apply cockpit --remote --env=""

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env=""

      - name: Verify health
        # /health answers without a sign-in (docs/deployment.md, "`/health`
        # answers without a sign-in"), so this assertion is a real one. It
        # covers the register and an account store, not the register alone —
        # see the same step in deploy-staging.yml.
        run: node scripts/health-check.mjs "https://cockpit.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev"

      - name: Summarise
        run: |
          {
            echo "### Promoted to production"
            echo
            echo "**Commit:** \`$(git rev-parse --short HEAD)\` $(git log -1 --pretty=%s)"
            echo "**URL:** https://cockpit.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
