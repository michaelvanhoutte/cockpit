name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # One review per pull request at a time. Superseded runs are cancelled: the
  # verdict that matters is the one for the current head, and paying for a
  # review of a commit nobody will merge buys nothing. Copied from
  # claude-security-review.yml, which had it while this file did not - eight
  # reviews ran to completion on `claude/richtext-action-scope-afec5f` in a day,
  # none under ten minutes, each posting against a different head. (codeql.yml
  # groups too, but cancels only on a pull request: its runs on `main` are the
  # baseline every pull request is compared against.)
  #
  # This used to leave a half-review green: cancel a run that has already posted
  # some of its findings and the run replacing it could decline as
  # already-reviewed, which the gate below reported as a warning rather than a
  # failure. Those partial findings answer the head that was just replaced, so
  # the gate's head test now refuses the replacement run - "The review check
  # goes green when the reviewer declined to look at the new commits" (issue
  # 75). Cancelling was always right regardless: the alternative is paying for
  # every superseded run in full.
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this diff touches anything for the review to look at - the same
  # question ci.yml's own `changes` job answers, over the same classifier
  # (scripts/lib/what-changed.mjs), asked again here because a skipped job
  # satisfies a required status check the same way there does ("Skip the code
  # review on a documentation-only pull request, as CI already skips its
  # jobs", issue 371). Duplicated rather than shared - this repository has no
  # reusable-workflow wiring, and the job is a dozen lines.
  #
  # Reads the *base* commit's own copy, never this branch's, for the reason
  # ci.yml's `changes` job gives: a branch left to answer this about its own
  # payload could talk itself out of being reviewed. Unlike ci.yml, this
  # workflow only ever triggers on `pull_request`, so there is no push-to-main
  # case to fall back to.
  #
  # Both steps are `continue-on-error`, and the gate below reads `!cancelled()`
  # rather than the bare output - see ci.yml's `changes` job for why: the
  # dangerous direction is a skip nobody meant, and a runner that never starts
  # answers to neither `continue-on-error`.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      product_changed: ${{ steps.classify.outputs.product_changed }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - name: Work out whether this diff touches the product
        id: classify
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$RUNNER_TEMP/base-classifier"
          mkdir -p "$base/lib"
          if git show "$BASE_SHA:scripts/what-changed.mjs" > "$base/what-changed.mjs" &&
             git show "$BASE_SHA:scripts/lib/what-changed.mjs" > "$base/lib/what-changed.mjs"; then
            node "$base/what-changed.mjs"
          else
            echo "::warning::The base commit carries no classifier, so the review runs rather than trusting this branch's own."
            echo "product_changed=true" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: changes
    # A fork's pull request gets a read-only token and no secrets, so this job
    # cannot run - and left to fail it would report red for a reason that has
    # nothing to do with the change, which is how a check stops being read.
    # Skipping says so instead. Never solved by reaching for
    # `pull_request_target`: that runs the base branch's workflow with the
    # secrets in scope against code the author controls, which on a public
    # repository hands CLAUDE_CODE_OAUTH_TOKEN to anyone who opens a pull
    # request. The same guard, and the same reasoning, is in
    # claude-security-review.yml.
    #
    # A draft is work in progress, and reviewing every intermediate push of one
    # costs a full run each time to tell someone something they already know
    # they have not finished. Marking it ready for review is in the trigger
    # types above, so a draft is reviewed the moment it stops being one. This
    # guard is what makes the skip cheap: the review already declined to *post*
    # on a draft, by an instruction in the prompt below, having first paid for
    # the whole run to reach that conclusion.
    #
    # A bot-authored pull request - Dependabot, the only one this repository
    # gets - is skipped for the same shape of reason as a fork: the action
    # below refuses to run for any actor not in `allowed_bots`, which does not
    # include `dependabot[bot]`, and left unguarded that is a hard failure
    # rather than a skip. Found live, not predicted: requiring this context
    # ("Require the two Claude reviews, once it is known what a required
    # review would break", issue 310) left pull requests 292 and 293 - both
    # open Dependabot pull requests at the time - unmergeable without an admin
    # bypass, the moment the payload applied. Skipping here is what a required
    # context does safely (see the mechanisms measured in docs/deployment.md);
    # adding `dependabot[bot]` to `allowed_bots` instead would spend a review
    # on diffs that are never more than a version bump.
    #
    # A documentation-only pull request is the fourth skip, decided by the
    # `changes` job above rather than here. It reports the same way the other
    # three do - the whole job, this assert step included, never runs, so
    # there is nothing here that could misread the skip as a reviewer who
    # looked and declined to speak. `!cancelled()` is what lets this guard run
    # despite `changes` failing outright rather than merely answering "no
    # output" - the same reasoning ci.yml's own gate gives.
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
      && github.event.pull_request.user.type != 'Bot'
      && needs.changes.outputs.product_changed != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write, not read: the review posts inline comments and a summary comment.
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review's fourth agent reads git blame/history for context.
          # fetch-depth: 1 leaves it with no history to read.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review commits pushed by the @claude workflow too. An explicit name
          # rather than '*': this repo is public, and '*' would let any GitHub
          # App trigger this workflow with a prompt it controls.
          allowed_bots: 'claude[bot]'
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is what makes the review post. Without it the command
          # stops after printing to a terminal nobody reads.
          prompt: '/code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The slash command declares its own allowed-tools, but the subagents
          # it launches do not inherit them, so every gh/git call was denied.
          # Skill is in the list because the plugin command is itself invoked
          # through the Skill tool: run 33201638348 denied "Execute skill:
          # code-review:code-review" and the review never started.
          # The appended system prompt is there because subagents default to
          # running in the background: run 33202122273 launched the review's
          # first agent, said "I will wait for the background agent completion
          # notification rather than polling", and ended. In a one-shot run
          # nothing ever sends that notification.
          # Its second half is there because the command's own stop conditions
          # include one for a pull request that is very simple and obviously ok,
          # and taking that one posts nothing at all: run 33407302266 judged
          # pull request 80 (a single zero-byte file deletion) too trivial to
          # review and stopped after 5 clean turns, having said nothing, which
          # the gate below could not tell from a review that never happened.
          # That decision was defensible - what is not is making it silently.
          # The other silent stop, "already reviewed", is not instructed away
          # but told what it is about: the head commit, not the pull request.
          # Left to read it as the pull request, the reviewer declines every
          # round after the first, which is "The review check goes green when
          # the reviewer declined to look at the new commits" (issue 75) - on
          # the fourth head of pull request 193, reasoning correctly right up to
          # the conclusion. Declining a genuine re-run, against a head it has
          # already spoken on, stays allowed and stays silent.
          claude_args: >-
            --allowedTools "Skill,Task,Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git log:*),Bash(git blame:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a single non-interactive run. Nothing will wake you once you stop, so a background task you are waiting on will never report back and the review will end having done nothing. Launch every subagent in the foreground and wait for its result before continuing. Never launch a background task, and never end your turn to wait for a completion notification. One of your stop conditions needs different handling here. Judging a change too simple, too obvious or too automated to be worth reviewing is a legitimate verdict, but it is still a verdict: post a short comment saying that is your conclusion, rather than stopping without a word. Nobody reads this run's log, so a review that ends having posted nothing is indistinguishable from one that never happened, and is treated as a failure. This applies to that condition only. Your other stop conditions are unchanged and must stay silent: say nothing on a closed pull request, and say nothing on a draft. The remaining one, already reviewed, is about the head commit rather than the pull request. The head you are reviewing is ${{ github.event.pull_request.head.sha }}. You have already reviewed it only if you have already posted about that commit; earlier rounds on earlier heads never make it reviewed, however many of them there were, however mechanical the commits since look, and however completely the findings they answer were replied to and resolved. Read what has arrived since you last posted here, and post about it. Decline in silence only for a head you have already spoken on."
          # Without this the action hides tool output, so a blocked review is
          # indistinguishable from a clean one.
          show_full_output: true

      - name: Assert the review actually ran
        if: always()
        env:
          CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The head the review was run against, which is what the gate asks
          # whether the reviewer spoke about. From the event payload rather than
          # the pull request's head now: a push landing while the review ran
          # gets its own run, and this one is answerable for the commit it was
          # given.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Every decision this makes is in scripts/lib/review-gate.mjs, asserted
        # by node --test in the Scripts job and shared with the security
        # review's gate, which documents each one and the run that motivated it.
        # It was ~140 lines of bash here until "Give the code review the tested
        # gate the security review already uses" (issue 277) moved it, and the
        # four occasions this file's comments record of a blocked or declining
        # session reporting green were all bugs in a parser nothing could run.
        # What either check decides is unchanged by that move.
        run: node scripts/assert-code-review.mjs "$EXECUTION_FILE" "$CONCLUSION"
